<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVid MegaPlay</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e2e8;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #topbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: #13131a;
            border-bottom: 1px solid #222230;
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow: visible;
        }

        #topbar-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height .28s ease, padding .28s ease;
            padding: 0;
        }

        #topbar-inner.open {
            max-height: 160px;
            padding: 8px 0;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #7c6dfa;
            white-space: nowrap;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-group label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .field-group input {
            width: 80px;
            padding: 4px 8px;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 6px;
            color: #e2e2e8;
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .field-group input:focus {
            border-color: #7c6dfa;
        }

        #lang-toggle {
            display: flex;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #lang-toggle button {
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        #lang-toggle button.active {
            background: #7c6dfa;
            color: #fff;
        }

        #autonext-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        #autonext-wrap span {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #2e2e42;
            border-radius: 20px;
            cursor: pointer;
            transition: background .2s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
        }

        .switch input:checked+.slider {
            background: #7c6dfa;
        }

        .switch input:checked+.slider::before {
            transform: translateX(16px);
        }

        .ctrl-btns {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .bar-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, transform .1s;
        }

        .bar-btn:active {
            transform: scale(.96);
        }

        #btn-prev-bar,
        #btn-next-bar {
            background: #1e1e2e;
            color: #aaa;
            border: 1px solid #2e2e42;
        }

        #btn-prev-bar:hover,
        #btn-next-bar:hover {
            background: rgba(124, 109, 250, .18);
            border-color: #7c6dfa;
            color: #fff;
        }

        #btn-go {
            background: #7c6dfa;
            color: #fff;
        }

        #btn-go:hover {
            background: #6a5be0;
        }

        #player-wrap {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #444;
            z-index: 0;
        }

        #placeholder svg {
            opacity: .3;
        }

        #placeholder p {
            font-size: 14px;
        }

        #placeholder .hint {
            font-size: 12px;
            color: #333;
        }

        #toggle-bar-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 20;
            width: 32px;
            height: 32px;
            background: rgba(19, 19, 26, .85);
            border: 1px solid #2e2e42;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background .15s, border-color .15s;
        }

        #toggle-bar-btn:hover {
            background: rgba(40, 40, 60, .95);
            border-color: #7c6dfa;
        }

        #toggle-bar-btn svg {
            display: block;
            transition: transform .25s ease;
        }

        #toggle-bar-btn.open svg {
            transform: rotate(180deg);
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="topbar">
            <div id="topbar-inner">
                <span class="brand">&#9654; OtakuVid</span>

                <div class="field-group">
                    <label>MAL ID</label>
                    <input id="inp-mal" type="number" placeholder="e.g. 21" min="1">
                </div>
                <div class="field-group">
                    <label>Episode</label>
                    <input id="inp-ep" type="number" placeholder="e.g. 1" min="1">
                </div>

                <div id="lang-toggle">
                    <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
                    <button id="btn-sub" onclick="setLang('sub')">SUB</button>
                </div>

                <div id="autonext-wrap">
                    <span>Auto-Next</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-autonext" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="ctrl-btns">
                    <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Prev
                    </button>
                    <button class="bar-btn" id="btn-go" onclick="loadPlayer()">&#9654; Play</button>
                    <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">
                        Next
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="player-wrap">
            <button id="toggle-bar-btn" onclick="toggleBar()" title="Toggle controls">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#aaa" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 8 11 13 6" />
                </svg>
            </button>

            <div id="placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
                </svg>
                <p>Click &#8964; top-right to open controls</p>
                <p class="hint">Enter MAL ID + Episode then press Play</p>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'dub';

        function toggleBar() {
            const inner = document.getElementById('topbar-inner');
            const btn = document.getElementById('toggle-bar-btn');
            btn.classList.toggle('open', inner.classList.toggle('open'));
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
        }

        function loadPlayer() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = document.getElementById('inp-ep').value.trim();
            if (!malId || !ep) { alert('Please enter both MAL ID and episode number.'); return; }
            // Player logic goes here
        }

        function goPrevEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep) || ep <= 1) return;
            document.getElementById('inp-ep').value = ep - 1;
        }

        function goNextEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            document.getElementById('inp-ep').value = ep + 1;
        }
    </script>
</body>

</html>
