<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVid MegaPlay Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e2e8;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #topbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: #13131a;
            border-bottom: 1px solid #222230;
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow: visible;
        }

        #topbar-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height .28s ease, padding .28s ease;
            padding: 0;
        }

        #topbar-inner.open {
            max-height: 160px;
            padding: 8px 0;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #7c6dfa;
            white-space: nowrap;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-group label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .field-group input {
            width: 80px;
            padding: 4px 8px;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 6px;
            color: #e2e2e8;
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .field-group input:focus {
            border-color: #7c6dfa;
        }

        #lang-toggle {
            display: flex;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #lang-toggle button {
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        #lang-toggle button.active {
            background: #7c6dfa;
            color: #fff;
        }

        #autonext-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        #autonext-wrap span {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #2e2e42;
            border-radius: 20px;
            cursor: pointer;
            transition: background .2s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
        }

        .switch input:checked+.slider {
            background: #7c6dfa;
        }

        .switch input:checked+.slider::before {
            transform: translateX(16px);
        }

        .ctrl-btns {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .bar-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, transform .1s;
        }

        .bar-btn:active {
            transform: scale(.96);
        }

        #btn-prev-bar,
        #btn-next-bar {
            background: #1e1e2e;
            color: #aaa;
            border: 1px solid #2e2e42;
        }

        #btn-prev-bar:hover,
        #btn-next-bar:hover {
            background: rgba(124, 109, 250, .18);
            border-color: #7c6dfa;
            color: #fff;
        }

        #btn-go {
            background: #7c6dfa;
            color: #fff;
        }

        #btn-go:hover {
            background: #6a5be0;
        }

        #player-wrap {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #player-wrap iframe,
        #player-wrap video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 1;
            object-fit: contain;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #444;
            z-index: 0;
        }

        #placeholder svg {
            opacity: .3;
        }

        #placeholder p {
            font-size: 14px;
        }

        #placeholder .hint {
            font-size: 12px;
            color: #333;
        }

        #toggle-bar-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 20;
            width: 32px;
            height: 32px;
            background: rgba(19, 19, 26, .85);
            border: 1px solid #2e2e42;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background .15s, border-color .15s;
        }

        #toggle-bar-btn:hover {
            background: rgba(40, 40, 60, .95);
            border-color: #7c6dfa;
        }

        #toggle-bar-btn svg {
            display: block;
            transition: transform .25s ease;
        }

        #toggle-bar-btn.open svg {
            transform: rotate(180deg);
        }

        #srv-wrap {
            position: relative;
            margin-left: auto;
            flex-shrink: 0;
        }

        #srv-toggle-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }

        #srv-toggle-btn.show {
            display: flex;
        }

        #srv-toggle-btn:hover,
        #srv-toggle-btn.open {
            border-color: #7c6dfa;
            color: #fff;
            background: rgba(124, 109, 250, .18);
        }

        #server-panel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 100;
            background: #13131a;
            border: 1px solid #2e2e42;
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 260px;
            max-width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
            display: none;
        }

        #server-panel.visible {
            display: block;
        }

        .sp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sp-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .07em;
        }

        #sp-close {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 2px;
        }

        #sp-close:hover {
            color: #aaa;
        }

        #quality-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .q-pill {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #2e2e42;
            background: #1e1e2e;
            color: #888;
            transition: all .15s;
        }

        .q-pill.active {
            background: #7c6dfa;
            border-color: #7c6dfa;
            color: #fff;
        }

        .q-pill:hover:not(.active):not(.unavail) {
            border-color: #7c6dfa;
            color: #ccc;
        }

        .q-pill.unavail {
            opacity: .3;
            cursor: default;
            pointer-events: none;
        }

        #server-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
        }

        #server-list::-webkit-scrollbar {
            width: 4px;
        }

        #server-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #server-list::-webkit-scrollbar-thumb {
            background: #2e2e42;
            border-radius: 4px;
        }

        .srv-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #2e2e42;
            background: #1a1a26;
            color: #ccc;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            text-align: left;
            width: 100%;
        }

        .srv-btn:hover {
            background: rgba(124, 109, 250, .18);
            border-color: #7c6dfa;
            color: #fff;
        }

        .srv-btn.active {
            background: rgba(124, 109, 250, .28);
            border-color: #7c6dfa;
            color: #fff;
        }

        .srv-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #2e2e42;
            color: #777;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .srv-btn.active .srv-badge {
            background: #7c6dfa;
            color: #fff;
        }

        #sp-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 12px;
            padding: 8px 0;
        }

        .spin {
            width: 14px;
            height: 14px;
            border: 2px solid #2e2e42;
            border-top-color: #7c6dfa;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #sp-error {
            color: #f87171;
            font-size: 12px;
            padding: 4px 0;
        }

        #autonext-overlay {
            display: none;
            position: absolute;
            bottom: 28px;
            right: 28px;
            background: rgba(10, 10, 15, .9);
            border: 1px solid #2e2e42;
            border-radius: 14px;
            padding: 14px 20px;
            min-width: 220px;
            z-index: 30;
            backdrop-filter: blur(6px);
        }

        .an-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 6px;
        }

        .an-ep {
            font-size: 15px;
            font-weight: 700;
            color: #e2e2e8;
            margin-bottom: 10px;
        }

        #an-bar-bg {
            width: 100%;
            height: 4px;
            background: #2e2e42;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #an-bar {
            height: 100%;
            width: 100%;
            background: #7c6dfa;
            border-radius: 4px;
            transform-origin: left;
            transition: transform linear;
        }

        .an-btns {
            display: flex;
            gap: 8px;
        }

        .an-btns button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        #an-btn-now {
            background: #7c6dfa;
            color: #fff;
        }

        #an-btn-now:hover {
            background: #6a5be0;
        }

        #an-btn-cancel {
            background: #1e1e2e;
            color: #aaa;
            border: 1px solid #2e2e42;
        }

        #an-btn-cancel:hover {
            background: #2e2e42;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="topbar">
            <div id="topbar-inner">
                <span class="brand">&#9654; OtakuVid</span>

                <div class="field-group">
                    <label>MAL ID</label>
                    <input id="inp-mal" type="number" placeholder="e.g. 21" min="1">
                </div>
                <div class="field-group">
                    <label>Episode</label>
                    <input id="inp-ep" type="number" placeholder="e.g. 1" min="1">
                </div>

                <div id="lang-toggle">
                    <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
                    <button id="btn-sub" onclick="setLang('sub')">SUB</button>
                </div>

                <div id="autonext-wrap">
                    <span>Auto-Next</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-autonext" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="ctrl-btns">
                    <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Prev
                    </button>
                    <button class="bar-btn" id="btn-go" onclick="loadPlayer()">&#9654; Play</button>
                    <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">
                        Next
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                    <div id="extract-spinner" style="display:none; align-items:center; gap:6px; color:#a78bfa; font-size:12px; font-weight:600; background:rgba(167, 139, 250, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(167, 139, 250, 0.25);">
                        <div class="spin"></div>
                        <span>Extracting...</span>
                    </div>
                    <div id="prefetch-status" style="display:none; align-items:center; gap:5px; color:#4ade80; font-size:12px; font-weight:600; background:rgba(74, 222, 128, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(74, 222, 128, 0.25);">
                        <span id="prefetch-icon">✓</span>
                        <span id="prefetch-status-text">+50 Ep Ready</span>
                    </div>
                </div>

                <div id="srv-wrap">
                    <button id="srv-toggle-btn" onclick="toggleServerPanel()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    </button>
                    <div id="server-panel">
                        <div class="sp-row">
                            <span class="sp-title">Servers &amp; Quality</span>
                            <button id="sp-close" onclick="toggleServerPanel()">&#10005;</button>
                        </div>
                        <div id="quality-row"></div>
                        <div id="sp-loading" style="display:none">
                            <div class="spin"></div> <span class="sp-label">Fetching streams&#8230;</span>
                        </div>
                        <div id="sp-error" style="display:none"></div>
                        <div id="server-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="player-wrap">
            <button id="toggle-bar-btn" onclick="toggleBar()" title="Toggle controls">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#aaa" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 8 11 13 6" />
                </svg>
            </button>

            <div id="placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
                </svg>
                <p>Click &#8964; top-right to open controls</p>
                <p class="hint">Enter MAL ID + Episode then press Play</p>
            </div>

            <video id="videoPlayer" controls autoplay style="display:none;"></video>
            <iframe id="player-iframe" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>

            <div id="autonext-overlay">
                <div class="an-title">Up next</div>
                <div class="an-ep" id="an-ep-label">Episode &#8212;</div>
                <div id="an-bar-bg">
                    <div id="an-bar"></div>
                </div>
                <div class="an-btns">
                    <button id="an-btn-now" onclick="goNextNow()">Play Now</button>
                    <button id="an-btn-cancel" onclick="cancelAutoNext()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_DATASET_URL = "https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/";
        const DATASET_FILENAMES = ["hianime_streams_list.json"].concat(
            Array.from({ length: 36 }, (_, i) => `hianime_streams_list_${i + 2}.json`)
        );

        let datasetCache = null;
        let hlsInstance = null;
        let currentLang = 'dub';
        let autoNextTimer = null;
        let activeServerStream = null;
        let allExtractedStreams = [];
        let cachedMalId = null;
        let cachedEp = null;
        let _fetchToken = 0;
        const COUNTDOWN_S = 10;

        const streamCache = new Map();
        let preFetchAbortToken = 0;

        // PROXY_HOST / DEFAULT_REFERER centralised so every caller (manifest AND
        // every sub-request hls.js makes) stays consistent.
        const PROXY_ORIGIN = 'https://anivexa.onrender.com';
        const PROXY_HOST = `${PROXY_ORIGIN}/proxy`;
        const DEFAULT_REFERER = 'https://otakuhg.site/';

        // ---- Proxy warm-up -------------------------------------------------
        // anivexa.onrender.com runs on Render's free tier, which spins the
        // service down after ~15 minutes of inactivity. A cold instance can
        // take 20-50+ seconds to wake up on its next request. hls.js's default
        // timeouts (10s manifest/level, 20s fragment) give up long before that,
        // which is exactly why playback "sometimes works, sometimes doesn't" -
        // it depends on whether the dyno happened to already be awake.
        //
        // We fire a fire-and-forget ping as early as possible (page load, and
        // again the instant the user asks for an episode) so the dyno is warm
        // by the time hls.js actually needs it. This is best-effort: failures
        // here are ignored, it's just a warm-up nudge.
        let proxyWarm = false;
        let proxyWarmupPromise = null;
        function warmupProxy() {
            if (proxyWarmupPromise) return proxyWarmupPromise;
            proxyWarmupPromise = fetch(PROXY_ORIGIN, { mode: 'no-cors', cache: 'no-store' })
                .catch(() => { })
                .finally(() => { proxyWarm = true; });
            return proxyWarmupPromise;
        }

        function getProxyUrl(url, referer = DEFAULT_REFERER) {
            if (!url) return '';
            // Already a fully-formed proxy URL -> don't wrap it a second time
            // (prevents the double-encoded "proxy of a proxy" bug).
            if (url.startsWith(PROXY_HOST)) return url;
            // Never try to proxy local/blob/data URLs.
            if (/^(blob:|data:)/i.test(url)) return url;
            return `${PROXY_HOST}?url=${encodeURIComponent(url)}&referer=${encodeURIComponent(referer)}`;
        }

        // =====================================================================
        // ADVANCED PROXY-AWARE HLS LOADER
        // =====================================================================
        // Why xhrSetup alone isn't enough:
        // A master playlist can point to variant/level playlists with a RELATIVE
        // path. Those level playlists can in turn point to segments and
        // #EXT-X-KEY URIs, ALSO often relative. hls.js resolves every relative
        // reference against the URL of the document it was just parsed from.
        //
        // If we ever hand hls.js (or its parser) a PROXIED url as "the current
        // document's URL", every relative reference inside gets resolved against
        // the proxy's own origin instead of the real CDN directory - producing
        // garbage URLs a few levels deep even if the very first request worked.
        // This is why playback can succeed for the master.txt itself yet still
        // die shortly after: the corruption happens on the SECOND hop (level
        // playlist or key), not the first.
        //
        // The fix: replace hls.js's entire network layer with a custom Loader
        // that keeps track of the TRUE (unproxied) URL at every single level -
        // manifest, level playlist, key, and fragment - and only proxies the
        // request at the very last moment, right before the fetch() call fires.
        // Text responses that look like playlists get every relative URI (plain
        // lines AND URI="..." attributes in #EXT-X-KEY / #EXT-X-MAP) resolved to
        // an ABSOLUTE (still real, not yet proxied) URL before being handed back
        // to hls.js. That absolute URL becomes "context.url" for whatever hls.js
        // requests next, so this stays correct no matter how many levels deep the
        // playlist hierarchy goes.
        // =====================================================================

        // The referer currently in effect for the stream hls.js is playing.
        // Set once per playStream() call, read by every request the custom
        // loader below makes (manifest, level, key, fragment).
        let CURRENT_STREAM_REFERER = DEFAULT_REFERER;

        function resolveAbsoluteUrl(possiblyRelative, baseUrl) {
            // Already absolute (has a scheme) - return untouched. Do NOT run
            // this through new URL(), which would force-lowercase the host.
            if (/^[a-z][a-z0-9+.-]*:\/\//i.test(possiblyRelative)) return possiblyRelative;

            // Protocol-relative ("//host/path") - borrow the base's scheme only.
            if (possiblyRelative.startsWith('//')) {
                const scheme = (baseUrl.match(/^[a-z][a-z0-9+.-]*:/i) || ['https:'])[0];
                return scheme + possiblyRelative;
            }

            // Genuinely relative path. CRITICAL: these obfuscated CDN hostnames
            // (e.g. "eTOjdo3Yv1iw.somehost.shop") are mixed-case tokens the
            // origin validates case-sensitively. The WHATWG URL parser used by
            // `new URL(rel, base).href` ALWAYS force-lowercases hostnames per
            // spec - that's true in every browser, not a quirk we can configure
            // away. So we split the base into its authority (scheme+host, kept
            // as an exact-case string) and its path, then use the URL API only
            // to resolve the PATH portion against a disposable dummy host -
            // that gets us battle-tested "../", "./" and query-string handling
            // for free, without ever letting the real hostname pass through the
            // part of the API that mangles case.
            const m = baseUrl.match(/^([a-z][a-z0-9+.-]*:\/\/[^\/?#]+)([^?#]*)/i);
            if (!m) return possiblyRelative; // malformed base, best effort
            const authority = m[1];
            const basePath = m[2] || '/';
            const DUMMY = 'http://relative-resolve.invalid';
            const resolvedPath = new URL(possiblyRelative, DUMMY + basePath).href.slice(DUMMY.length);
            return authority + resolvedPath;
        }

        function looksLikePlaylist(text) {
            return typeof text === 'string' && text.trimStart().startsWith('#EXTM3U');
        }

        // Resolves every relative URI in a playlist to an ABSOLUTE (still
        // unproxied) URL against baseUrl. Does NOT proxy anything here - that
        // happens later, per-request, inside the loader's load().
        function rewritePlaylistUrlsToAbsolute(text, baseUrl) {
            const attrUriRegex = /URI="([^"]+)"/i;
            return text.split(/\r?\n/).map(line => {
                const trimmed = line.trim();
                if (!trimmed) return line;

                if (trimmed.startsWith('#')) {
                    // Tags carrying a URI="..." attribute: #EXT-X-KEY, #EXT-X-MAP,
                    // #EXT-X-MEDIA (audio/subtitle groups), etc.
                    if (attrUriRegex.test(trimmed)) {
                        return line.replace(attrUriRegex, (m, uri) =>
                            `URI="${resolveAbsoluteUrl(uri, baseUrl)}"`);
                    }
                    return line;
                }

                // A bare line that isn't a tag is a URI: either a variant
                // playlist reference (master) or a segment reference (level).
                return resolveAbsoluteUrl(trimmed, baseUrl);
            }).join('\n');
        }

        class ProxyAwareHlsLoader {
            constructor(config) {
                this.config = config;
                this.stats = {
                    aborted: false, loaded: 0, retry: 0, total: 0,
                    chunkCount: 0, bwEstimate: 0,
                    loading: { start: 0, first: 0, end: 0 },
                    parsing: { start: 0, end: 0 },
                    buffering: { start: 0, first: 0, end: 0 },
                };
                this.context = null;
                this.callbacks = null;
                this.controller = null;
                this._timeoutId = null;
            }

            destroy() { this.abort(); }

            abort() {
                if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
                if (this.controller && !this.stats.aborted) {
                    this.stats.aborted = true;
                    try { this.controller.abort(); } catch (e) { }
                }
            }

            load(context, config, callbacks) {
                this.context = context;
                this.callbacks = callbacks;
                this.controller = new AbortController();

                // context.url is always the TRUE, unproxied, absolute URL at this
                // point - either the one we originally passed to loadSource(), or
                // one we produced via rewritePlaylistUrlsToAbsolute() on a prior
                // hop. We proxy it ONLY for the actual network call below.
                const originalUrl = context.url;
                const referer = CURRENT_STREAM_REFERER;
                const proxiedUrl = getProxyUrl(originalUrl, referer);
                const isBinary = context.responseType === 'arraybuffer';
                const timeoutMs = isBinary ? 40000 : 30000; // generous: proxy hop can be slow

                const start = performance.now();
                this.stats.loading.start = start;

                this._timeoutId = setTimeout(() => this.abort(), timeoutMs);

                fetch(proxiedUrl, { signal: this.controller.signal, cache: 'no-store' })
                    .then(async (res) => {
                        if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
                        if (!res.ok) throw new Error('HTTP ' + res.status);

                        this.stats.loading.first = performance.now();

                        let data;
                        if (isBinary) {
                            data = await res.arrayBuffer();
                            this.stats.loaded = this.stats.total = data.byteLength;
                        } else {
                            let text = await res.text();
                            if (looksLikePlaylist(text)) {
                                text = rewritePlaylistUrlsToAbsolute(text, originalUrl);
                            }
                            data = text;
                            this.stats.loaded = this.stats.total = text.length;
                        }

                        this.stats.loading.end = performance.now();
                        this.callbacks.onSuccess(
                            { url: originalUrl, data },
                            this.stats,
                            context,
                            null
                        );
                    })
                    .catch((err) => {
                        if (this._timeoutId) { clearTimeout(this._timeoutId); this._timeoutId = null; }
                        if (this.stats.aborted) {
                            if (this.callbacks.onAbort) this.callbacks.onAbort(this.stats, context, null);
                            return;
                        }
                        if (this.callbacks.onError) {
                            this.callbacks.onError(
                                { code: (err && err.status) || 0, text: (err && err.message) || 'proxy fetch failed' },
                                context, null, this.stats
                            );
                        }
                    });
            }
        }

        async function loadAllDatasets() {
            if (datasetCache) return datasetCache;
            try {
                const promises = DATASET_FILENAMES.map(fname =>
                    fetch(BASE_DATASET_URL + fname)
                        .then(r => r.ok ? r.json() : [])
                        .catch(() => [])
                );
                const results = await Promise.all(promises);
                datasetCache = results.flat();
                return datasetCache;
            } catch (err) {
                throw new Error("Failed to load OtakuVid datasets: " + err.message);
            }
        }

        async function searchOtakuVid(malId, epNum) {
            const datasets = await loadAllDatasets();
            const targetMid = String(malId).trim();
            const targetEp = String(epNum).trim();

            return datasets.find(item => {
                const mid = String(item["mal_id/anilist_id/tmdb_id"] || item.mal_id || '').trim();
                const ep = String(item["episode_no"] || item.ep || '').trim();
                return mid === targetMid && ep === targetEp;
            });
        }

        async function fetchHtmlWithProxy(url) {
            const proxyUrls = [];
            if (window.location.origin && window.location.protocol.startsWith('http') && !window.location.origin.includes('github.io')) {
                proxyUrls.push(window.location.origin + `/proxy?url=${encodeURIComponent(url)}`);
            }
            proxyUrls.push(
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            );

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetch(pUrl);
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.length > 50) return text;
                    }
                } catch (e) { }
            }
            throw new Error("Could not fetch page content via proxies");
        }

        function unpackPackedJS(html) {
            const match = html.match(/eval\(function\(p,a,c,k,e,d\).*?'(.*?)',(\d+),(\d+),'(.*?)'\.split\('\|'\)\)\)/s);
            if (!match) return "";
            let payload = match[1];
            const base = parseInt(match[2], 10);
            const count = parseInt(match[3], 10);
            const words = match[4].split("|");

            function unbase(n, b) {
                const chars = "0123456789abcdefghijklmnopqrstuvwxyz";
                let res = "";
                while (n > 0) {
                    res = chars[n % b] + res;
                    n = Math.floor(n / b);
                }
                return res || "0";
            }

            for (let i = count - 1; i >= 0; i--) {
                if (words[i]) {
                    const token = unbase(i, base);
                    const reg = new RegExp('\\b' + token + '\\b', 'g');
                    payload = payload.replace(reg, words[i]);
                }
            }
            return payload;
        }

        async function parseMasterPlaylist(masterUrl, pageUrl) {
            try {
                const proxiedMaster = getProxyUrl(masterUrl);
                const res = await fetch(proxiedMaster);
                if (!res.ok) return [];
                const content = await res.text();

                const base = masterUrl.substring(0, masterUrl.lastIndexOf("/") + 1);
                const variants = [];
                const lines = content.split(/\r?\n/);

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith("#EXT-X-STREAM-INF:")) {
                        const resMatch = line.match(/RESOLUTION=(\d+x\d+)/i);
                        const bwMatch = line.match(/BANDWIDTH=(\d+)/i);
                        const resolution = resMatch ? resMatch[1] : "HD";
                        const bandwidth = bwMatch ? bwMatch[1] : "0";

                        let qLabel = "HD";
                        if (resolution.includes("1920") || resolution.includes("1080")) qLabel = "1080p";
                        else if (resolution.includes("1280") || resolution.includes("720")) qLabel = "720p";
                        else if (resolution.includes("854") || resolution.includes("480")) qLabel = "480p";
                        else if (resolution.includes("640") || resolution.includes("360")) qLabel = "360p";

                        if (i + 1 < lines.length) {
                            const streamPath = lines[i + 1].trim();
                            if (streamPath && !streamPath.startsWith("#")) {
                                const absStream = streamPath.startsWith("http") ? streamPath : base + streamPath;
                                variants.push({
                                    quality: qLabel,
                                    resolution: resolution,
                                    bandwidth: bandwidth,
                                    url: absStream
                                });
                            }
                        }
                    }
                }
                return variants;
            } catch (e) {
                return [];
            }
        }

        async function extractOtakuVidStreams(embedUrl) {
            try {
                const html = await fetchHtmlWithProxy(embedUrl);
                const decodedJs = unpackPackedJS(html);

                let masterUrl = null;
                const m3u8Match = (decodedJs + html).match(/https?:\/\/[^\s"'<>]+?\.(?:m3u8|txt)[^\s"'<>]*/i);
                if (m3u8Match) {
                    masterUrl = m3u8Match[0];
                }

                const variants = masterUrl ? await parseMasterPlaylist(masterUrl, embedUrl) : [];
                return { masterUrl, variants, rawHtml: html };
            } catch (e) {
                return { masterUrl: null, variants: [], error: e.message };
            }
        }

        async function getOtakuVidStreams(malId, epNum) {
            const cacheKey = `${malId}_${epNum}`;
            if (streamCache.has(cacheKey)) {
                return await streamCache.get(cacheKey);
            }

            const fetchPromise = (async () => {
                const matchedEntry = await searchOtakuVid(malId, epNum);
                if (!matchedEntry) throw new Error(`MAL ID ${malId} Episode ${epNum} not found in OtakuVid datasets`);

                const title = matchedEntry.anime_name || matchedEntry.title || `Anime ${malId}`;
                const streams = [];

                const embedEntries = [];
                Object.keys(matchedEntry).forEach(k => {
                    const v = matchedEntry[k];
                    if (typeof v === 'string') {
                        const kLower = String(k).toLowerCase();
                        const vLower = v.toLowerCase();
                        if (vLower.includes("otakuvid.online") || vLower.includes("earnvids") || vLower.includes("oktavid") || kLower.includes("otakuvid") || kLower.includes("oktavid") || kLower.includes("earnvids")) {
                            const isDub = kLower.includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    }
                });

                if (embedEntries.length === 0) {
                    Object.keys(matchedEntry).forEach(k => {
                        const v = matchedEntry[k];
                        if (typeof v === 'string' && v.startsWith("http")) {
                            const isDub = String(k).toLowerCase().includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    });
                }

                for (const emb of embedEntries) {
                    try {
                        const extracted = await extractOtakuVidStreams(emb.url);
                        if (extracted.variants && extracted.variants.length > 0) {
                            extracted.variants.forEach(varItem => {
                                streams.push({
                                    server: `OtakuVid ${emb.lang.toUpperCase()} (${varItem.quality})`,
                                    url: varItem.url,
                                    type: "mp4",
                                    quality: varItem.quality,
                                    lang: emb.lang,
                                    embed_url: emb.url
                                });
                            });
                        } else if (extracted.masterUrl) {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (HD)`,
                                url: extracted.masterUrl,
                                type: "mp4",
                                quality: "HD",
                                lang: emb.lang,
                                embed_url: emb.url
                            });
                        } else {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                                url: emb.url,
                                type: "iframe",
                                quality: "Embed",
                                lang: emb.lang
                            });
                        }
                    } catch (e) {
                        streams.push({
                            server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                            url: emb.url,
                            type: "iframe",
                            quality: "Embed",
                            lang: emb.lang
                        });
                    }
                }

                return {
                    status: "success",
                    server: "OtakuVid",
                    malId: parseInt(malId),
                    episode: parseInt(epNum),
                    animeTitle: title,
                    results: {
                        stream_url: streams.length > 0 ? streams[0].url : null,
                        streams: streams
                    }
                };
            })();

            streamCache.set(cacheKey, fetchPromise);
            return await fetchPromise;
        }

        async function preExtractNextEpisodes(malId, currentEpNum, totalToFetch = 50) {
            const myPrefetchToken = ++preFetchAbortToken;
            const startEp = parseInt(currentEpNum, 10) + 1;
            const statusEl = document.getElementById('prefetch-status');
            const statusIcon = document.getElementById('prefetch-icon');
            const statusText = document.getElementById('prefetch-status-text');

            const endEp = startEp + totalToFetch - 1;
            const targetCount = totalToFetch;

            if (statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#a78bfa';
                statusEl.style.background = 'rgba(167, 139, 250, 0.12)';
                statusEl.style.borderColor = 'rgba(167, 139, 250, 0.25)';
                if (statusIcon) statusIcon.textContent = '⚡';
                statusText.textContent = `Pre-extracting +${targetCount} Ep...`;
            }

            let fetchedCount = 0;
            for (let ep = startEp; ep <= endEp; ep++) {
                if (myPrefetchToken !== preFetchAbortToken) return;

                const cacheKey = `${malId}_${ep}`;
                if (!streamCache.has(cacheKey)) {
                    try {
                        await getOtakuVidStreams(malId, ep);
                        if (myPrefetchToken !== preFetchAbortToken) return;
                    } catch (e) {
                        // Silently handle background prefetch errors
                    }
                    await new Promise(r => setTimeout(r, 350));
                }
                fetchedCount++;
                if (statusText && myPrefetchToken === preFetchAbortToken) {
                    statusText.textContent = `Pre-extracting (${fetchedCount}/${targetCount})...`;
                }
            }

            if (myPrefetchToken === preFetchAbortToken && statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#4ade80';
                statusEl.style.background = 'rgba(74, 222, 128, 0.12)';
                statusEl.style.borderColor = 'rgba(74, 222, 128, 0.25)';
                if (statusIcon) statusIcon.textContent = '✓';
                statusText.textContent = `+${targetCount} Ep Ready`;
            }
        }

        function playStream(stream) {
            activeServerStream = stream;
            const placeholder = document.getElementById('placeholder');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('player-iframe');

            placeholder.style.display = 'none';

            if (!stream) return;

            if (stream.type === 'iframe') {
                video.style.display = 'none';
                video.pause();
                iframe.src = stream.url;
                iframe.style.display = 'block';
                return;
            }

            iframe.style.display = 'none';
            iframe.src = 'about:blank';
            video.style.display = 'block';

            // Referer required by the source CDN for THIS stream. Falls back to the
            // default if the dataset entry doesn't specify one.
            const streamReferer = stream.referer || DEFAULT_REFERER;

            // IMPORTANT: hls.js (and the custom loader below) resolves every
            // relative URI it encounters inside a playlist (variant playlists,
            // keys, segments) against the URL that document was fetched from.
            // The ProxyAwareHlsLoader tracks the TRUE (unproxied) URL at every
            // hop and only proxies at the moment of the actual network call -
            // see the loader's comments above for the full explanation.
            const realUrl = stream.url;
            const proxiedUrl = getProxyUrl(realUrl, streamReferer); // used only for the non-hls.js (native) fallback path below

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            if (realUrl.includes('.m3u8') || realUrl.includes('.txt')) {
                if (Hls.isSupported()) {
                    let retryAttempt = 0;
                    const MAX_RETRIES = 4;
                    const RETRY_DELAYS_MS = [1500, 3000, 6000, 10000]; // backoff, room for a cold proxy dyno

                    const buildHls = () => {
                        CURRENT_STREAM_REFERER = streamReferer;
                        return new Hls({
                            // THE ACTUAL FIX: a fully custom loader (see
                            // ProxyAwareHlsLoader above) that keeps the TRUE
                            // absolute URL at every hop of the playlist
                            // hierarchy (master -> level -> key/fragment) and
                            // only proxies the request at the moment it's
                            // actually sent. xhrSetup alone can't do this
                            // because it can't rewrite relative URLs found
                            // INSIDE a fetched playlist body - only a custom
                            // loader that post-processes the response can.
                            loader: ProxyAwareHlsLoader,

                            // Generous retry budget: the proxy (anivexa.onrender.com,
                            // a free-tier Render service) can be slow to respond,
                            // especially right after a period of inactivity.
                            manifestLoadingTimeOut: 30000,
                            manifestLoadingMaxRetry: 6,
                            manifestLoadingRetryDelay: 1500,
                            manifestLoadingMaxRetryTimeout: 30000,
                            levelLoadingTimeOut: 30000,
                            levelLoadingMaxRetry: 6,
                            levelLoadingRetryDelay: 1500,
                            levelLoadingMaxRetryTimeout: 30000,
                            fragLoadingTimeOut: 40000,
                            fragLoadingMaxRetry: 8,
                            fragLoadingRetryDelay: 1500,
                            fragLoadingMaxRetryTimeout: 30000,
                        });
                    };

                    const setStatus = (msg) => {
                        const load = document.getElementById('sp-loading');
                        const errEl = document.getElementById('sp-error');
                        if (msg) {
                            if (errEl) errEl.style.display = 'none';
                            if (load) { load.style.display = 'flex'; }
                            const label = load && load.querySelector('.sp-label');
                            if (label) label.textContent = msg;
                        }
                    };

                    const startHls = () => {
                        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                        hlsInstance = buildHls();
                        hlsInstance.loadSource(realUrl);
                        hlsInstance.attachMedia(video);

                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            retryAttempt = 0; // fully recovered, reset backoff counter
                            document.getElementById('sp-loading').style.display = 'none';
                            video.play().catch(() => { video.muted = true; video.play(); });
                        });

                        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                            console.error('HLS error:', data.type, data.details, data);
                            if (!data.fatal) return;

                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    if (retryAttempt < MAX_RETRIES) {
                                        const delay = RETRY_DELAYS_MS[retryAttempt] || RETRY_DELAYS_MS[RETRY_DELAYS_MS.length - 1];
                                        retryAttempt++;
                                        setStatus(`Connection hiccup, retrying (${retryAttempt}/${MAX_RETRIES})...`);
                                        // Fully re-init rather than just startLoad() -
                                        // a cold-starting proxy can leave hls.js's
                                        // internal state (and the video element)
                                        // wedged, so a clean restart is more reliable
                                        // than resuming the same broken session.
                                        setTimeout(startHls, delay);
                                    } else {
                                        document.getElementById('sp-loading').style.display = 'none';
                                        const errEl = document.getElementById('sp-error');
                                        errEl.style.display = 'block';
                                        errEl.innerHTML = '';
                                        const msg = document.createElement('div');
                                        msg.textContent = 'Stream failed to load after several attempts. The source or proxy may be temporarily down.';
                                        const retryBtn = document.createElement('button');
                                        retryBtn.textContent = 'Retry';
                                        retryBtn.style.cssText = 'margin-top:8px;padding:6px 16px;border:none;border-radius:6px;background:#7c6dfa;color:#fff;font-weight:600;cursor:pointer;';
                                        retryBtn.onclick = () => {
                                            retryAttempt = 0;
                                            errEl.style.display = 'none';
                                            warmupProxy();
                                            startHls();
                                        };
                                        errEl.appendChild(msg);
                                        errEl.appendChild(retryBtn);
                                    }
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hlsInstance.recoverMediaError();
                                    break;
                                default:
                                    hlsInstance.destroy();
                                    break;
                            }
                        });
                    };

                    startHls();
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedUrl;
                    video.play().catch(() => { video.muted = true; video.play(); });
                }
            } else {
                video.src = proxiedUrl;
                video.play().catch(() => { video.muted = true; video.play(); });
            }

            video.onended = () => {
                const malId = document.getElementById('inp-mal').value.trim();
                const ep = document.getElementById('inp-ep').value.trim();
                if (malId && ep) triggerAutoNext(malId, ep, currentLang);
            };
        }

        function renderServerPanel(streams) {
            const qRow = document.getElementById('quality-row');
            const srvList = document.getElementById('server-list');
            const spLoad = document.getElementById('sp-loading');
            const spErr = document.getElementById('sp-error');
            const srvBtn = document.getElementById('srv-toggle-btn');

            spLoad.style.display = 'none';
            spErr.style.display = 'none';
            qRow.innerHTML = '';
            srvList.innerHTML = '';

            if (!streams || !streams.length) {
                spErr.style.display = 'block';
                spErr.textContent = 'No streams found for this episode.';
                if (srvBtn) {
                    srvBtn.innerHTML = `
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    `;
                }
                return;
            }

            const qualSet = new Set(["1080p", "720p", "480p", "360p"]);
            streams.forEach(s => { if (s.quality && s.quality !== 'Embed') qualSet.add(s.quality); });

            Array.from(qualSet).forEach(q => {
                let matchingStream = streams.find(s => s.lang === currentLang && ((s.quality || '').includes(q) || (s.server || '').includes(q)));
                if (!matchingStream) {
                    matchingStream = streams.find(s => (s.quality || '').includes(q) || (s.server || '').includes(q));
                }

                const pill = document.createElement('button');
                const isActive = (matchingStream && activeServerStream === matchingStream);
                pill.className = 'q-pill' + (isActive ? ' active' : '') + (matchingStream ? '' : ' unavail');
                pill.textContent = q;
                if (matchingStream) {
                    pill.onclick = () => {
                        document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                        playStream(matchingStream);
                        if (matchingStream.lang) {
                            currentLang = matchingStream.lang;
                            document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                            document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                        }
                        renderServerPanel(allExtractedStreams);
                    };
                }
                qRow.appendChild(pill);
            });

            const sortedStreams = [...streams].sort((a, b) => {
                if (a.lang === currentLang && b.lang !== currentLang) return -1;
                if (a.lang !== currentLang && b.lang === currentLang) return 1;
                return 0;
            });

            sortedStreams.forEach((st, idx) => {
                const btn = document.createElement('button');
                const isCurrentActive = (activeServerStream === st || (!activeServerStream && idx === 0));
                btn.className = 'srv-btn' + (isCurrentActive ? ' active' : '');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = st.server || `OtakuVid Server ${idx + 1}`;
                btn.appendChild(nameSpan);

                const badgeText = (st.quality || '') + (st.lang ? ` ${st.lang.toUpperCase()}` : '');
                if (badgeText.trim()) {
                    const badge = document.createElement('span');
                    badge.className = 'srv-badge';
                    badge.textContent = badgeText.trim();
                    btn.appendChild(badge);
                }

                btn.onclick = () => {
                    document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playStream(st);
                    if (st.lang) {
                        currentLang = st.lang;
                        document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                        document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                    }
                    renderServerPanel(allExtractedStreams);
                };

                srvList.appendChild(btn);
            });

            if (srvBtn) {
                const activeRes = activeServerStream ? `${activeServerStream.quality} ${activeServerStream.lang ? activeServerStream.lang.toUpperCase() : ''}` : '';
                srvBtn.innerHTML = `
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="4" rx="1" />
                        <rect x="2" y="10" width="20" height="4" rx="1" />
                        <rect x="2" y="17" width="20" height="4" rx="1" />
                    </svg>
                    Servers (${activeRes.trim() ? activeRes.trim() : streams.length + ' Streams'})
                `;
            }
        }

        function getBestHdStream(streams, preferredLang = 'dub') {
            if (!streams || streams.length === 0) return null;
            const priority = ["1080p", "720p", "480p", "360p"];

            const prefStreams = streams.filter(s => s.lang === preferredLang);
            if (prefStreams.length > 0) {
                for (const res of priority) {
                    const found = prefStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return prefStreams[0];
            }

            const altLang = preferredLang === 'dub' ? 'sub' : 'dub';
            const altStreams = streams.filter(s => s.lang === altLang);
            if (altStreams.length > 0) {
                for (const res of priority) {
                    const found = altStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return altStreams[0];
            }

            for (const res of priority) {
                const found = streams.find(s => (s.quality || s.server || '').includes(res));
                if (found) return found;
            }
            return streams[0];
        }

        async function showPlayer(malId, ep, lang = 'dub') {
            cancelAutoNext();
            currentLang = lang;
            const myToken = ++_fetchToken;

            // Kick the proxy awake immediately, in parallel with everything
            // else below - don't await it, it's just a warm-up nudge so it's
            // hopefully already awake by the time hls.js needs it.
            warmupProxy();

            document.getElementById('inp-mal').value = malId;
            document.getElementById('inp-ep').value = ep;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');

            document.title = `OtakuVid · MAL ${malId} · Ep ${ep} · ${lang.toUpperCase()}`;

            const spinner = document.getElementById('extract-spinner');
            const prefetchStatus = document.getElementById('prefetch-status');
            if (spinner) spinner.style.display = 'flex';
            if (prefetchStatus) prefetchStatus.style.display = 'none';

            document.getElementById('srv-toggle-btn').classList.add('show');
            document.getElementById('quality-row').innerHTML = '';
            document.getElementById('server-list').innerHTML = '';
            document.getElementById('sp-error').style.display = 'none';
            document.getElementById('sp-loading').style.display = 'flex';

            try {
                const data = await getOtakuVidStreams(malId, ep);
                if (myToken !== _fetchToken) return;

                document.getElementById('sp-loading').style.display = 'none';

                const streams = data.results.streams || [];
                allExtractedStreams = streams;
                cachedMalId = String(malId);
                cachedEp = String(ep);

                if (streams.length > 0) {
                    const best = getBestHdStream(streams, lang);
                    playStream(best);
                    renderServerPanel(streams);

                    preExtractNextEpisodes(malId, ep, 50);
                } else {
                    document.getElementById('sp-error').style.display = 'block';
                    document.getElementById('sp-error').textContent = `No streams available for MAL ${malId} Ep ${ep}.`;
                }
            } catch (err) {
                if (myToken !== _fetchToken) return;
                document.getElementById('sp-loading').style.display = 'none';
                document.getElementById('sp-error').style.display = 'block';
                document.getElementById('sp-error').textContent = 'Error: ' + err.message;
            } finally {
                if (myToken === _fetchToken && spinner) {
                    spinner.style.display = 'none';
                }
            }
        }

        function loadPlayer() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = document.getElementById('inp-ep').value.trim();
            if (!malId || !ep) { alert('Please enter both MAL ID and episode number.'); return; }
            showPlayer(malId, ep, currentLang);
        }

        function goPrevEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep) || ep <= 1) return;
            showPlayer(malId, ep - 1, currentLang);
        }

        function goNextEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function triggerAutoNext(malId, ep, lang) {
            if (!document.getElementById('chk-autonext').checked) return;
            const nextEp = parseInt(ep, 10) + 1;
            document.getElementById('an-ep-label').textContent = `Episode ${nextEp}`;
            const overlay = document.getElementById('autonext-overlay');
            const bar = document.getElementById('an-bar');
            overlay.style.display = 'block';
            bar.style.transition = 'none';
            bar.style.transform = 'scaleX(1)';
            bar.getBoundingClientRect();
            bar.style.transition = `transform ${COUNTDOWN_S}s linear`;
            bar.style.transform = 'scaleX(0)';
            let remaining = COUNTDOWN_S;
            autoNextTimer = setInterval(() => { if (--remaining <= 0) goNextNow(); }, 1000);
        }

        function goNextNow() {
            cancelAutoNext();
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function cancelAutoNext() {
            clearInterval(autoNextTimer);
            autoNextTimer = null;
            const overlay = document.getElementById('autonext-overlay');
            if (overlay) overlay.style.display = 'none';
        }

        function parseParamsFromUrl() {
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            const pathMatch = path.match(/\/(\d+)\/(\d+)(?:\/(dub|sub))?\/?$/i);
            if (pathMatch) {
                return { malId: pathMatch[1], epNum: pathMatch[2], lang: pathMatch[3] || 'dub' };
            }

            const queryDirectMatch = search.match(/\?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (queryDirectMatch) {
                return { malId: queryDirectMatch[1], epNum: queryDirectMatch[2], lang: queryDirectMatch[3] || 'dub' };
            }

            const searchParams = new URLSearchParams(search);
            const qMal = searchParams.get('mal_id') || searchParams.get('malId') || searchParams.get('id');
            const qEp = searchParams.get('ep') || searchParams.get('ep_num') || searchParams.get('episode');
            const qLang = searchParams.get('lang') || searchParams.get('type');
            if (qMal && qEp) {
                return { malId: qMal, epNum: qEp, lang: qLang || 'dub' };
            }

            const hashMatch = hash.match(/#\/?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (hashMatch) {
                return { malId: hashMatch[1], epNum: hashMatch[2], lang: hashMatch[3] || 'dub' };
            }

            return null;
        }

        window.OtakuVidAPI = {
            getStreams: getOtakuVidStreams,
            search: searchOtakuVid,
            loadDatasets: loadAllDatasets,
            getProxyUrl: getProxyUrl
        };

        window.addEventListener('DOMContentLoaded', () => {
            warmupProxy(); // wake the proxy dyno as early as the page itself loads
            const params = parseParamsFromUrl();
            if (params) {
                showPlayer(params.malId, params.epNum, params.lang);
            }
        });
    </script>
