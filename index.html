<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVid MegaPlay Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e2e2e8;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #topbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: #13131a;
            border-bottom: 1px solid #222230;
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow: visible;
        }

        #topbar-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height .28s ease, padding .28s ease;
            padding: 0;
        }

        #topbar-inner.open {
            max-height: 160px;
            padding: 8px 0;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #7c6dfa;
            white-space: nowrap;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .field-group label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .field-group input {
            width: 80px;
            padding: 4px 8px;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 6px;
            color: #e2e2e8;
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .field-group input:focus {
            border-color: #7c6dfa;
        }

        #lang-toggle {
            display: flex;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        #lang-toggle button {
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        #lang-toggle button.active {
            background: #7c6dfa;
            color: #fff;
        }

        #autonext-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        #autonext-wrap span {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #2e2e42;
            border-radius: 20px;
            cursor: pointer;
            transition: background .2s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
        }

        .switch input:checked+.slider {
            background: #7c6dfa;
        }

        .switch input:checked+.slider::before {
            transform: translateX(16px);
        }

        .ctrl-btns {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .bar-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, transform .1s;
        }

        .bar-btn:active {
            transform: scale(.96);
        }

        #btn-prev-bar,
        #btn-next-bar {
            background: #1e1e2e;
            color: #aaa;
            border: 1px solid #2e2e42;
        }

        #btn-prev-bar:hover,
        #btn-next-bar:hover {
            background: rgba(124, 109, 250, .18);
            border-color: #7c6dfa;
            color: #fff;
        }

        #btn-go {
            background: #7c6dfa;
            color: #fff;
        }

        #btn-go:hover {
            background: #6a5be0;
        }

        #player-wrap {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #player-wrap iframe,
        #player-wrap video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 1;
            object-fit: contain;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #444;
            z-index: 0;
        }

        #placeholder svg {
            opacity: .3;
        }

        #placeholder p {
            font-size: 14px;
        }

        #placeholder .hint {
            font-size: 12px;
            color: #333;
        }

        #toggle-bar-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 20;
            width: 32px;
            height: 32px;
            background: rgba(19, 19, 26, .85);
            border: 1px solid #2e2e42;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: background .15s, border-color .15s;
        }

        #toggle-bar-btn:hover {
            background: rgba(40, 40, 60, .95);
            border-color: #7c6dfa;
        }

        #toggle-bar-btn svg {
            display: block;
            transition: transform .25s ease;
        }

        #toggle-bar-btn.open svg {
            transform: rotate(180deg);
        }

        #srv-wrap {
            position: relative;
            margin-left: auto;
            flex-shrink: 0;
        }

        #srv-toggle-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: #1e1e2e;
            border: 1px solid #2e2e42;
            border-radius: 8px;
            color: #aaa;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
        }

        #srv-toggle-btn.show {
            display: flex;
        }

        #srv-toggle-btn:hover,
        #srv-toggle-btn.open {
            border-color: #7c6dfa;
            color: #fff;
            background: rgba(124, 109, 250, .18);
        }

        #server-panel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 100;
            background: #13131a;
            border: 1px solid #2e2e42;
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 260px;
            max-width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
            display: none;
        }

        #server-panel.visible {
            display: block;
        }

        .sp-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sp-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .07em;
        }

        #sp-close {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0 2px;
        }

        #sp-close:hover {
            color: #aaa;
        }

        #quality-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .q-pill {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #2e2e42;
            background: #1e1e2e;
            color: #888;
            transition: all .15s;
        }

        .q-pill.active {
            background: #7c6dfa;
            border-color: #7c6dfa;
            color: #fff;
        }

        .q-pill:hover:not(.active):not(.unavail) {
            border-color: #7c6dfa;
            color: #ccc;
        }

        .q-pill.unavail {
            opacity: .3;
            cursor: default;
            pointer-events: none;
        }

        #server-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
        }

        #server-list::-webkit-scrollbar {
            width: 4px;
        }

        #server-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #server-list::-webkit-scrollbar-thumb {
            background: #2e2e42;
            border-radius: 4px;
        }

        .srv-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid #2e2e42;
            background: #1a1a26;
            color: #ccc;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            text-align: left;
            width: 100%;
        }

        .srv-btn:hover {
            background: rgba(124, 109, 250, .18);
            border-color: #7c6dfa;
            color: #fff;
        }

        .srv-btn.active {
            background: rgba(124, 109, 250, .28);
            border-color: #7c6dfa;
            color: #fff;
        }

        .srv-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #2e2e42;
            color: #777;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .srv-btn.active .srv-badge {
            background: #7c6dfa;
            color: #fff;
        }

        #sp-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 12px;
            padding: 8px 0;
        }

        .spin {
            width: 14px;
            height: 14px;
            border: 2px solid #2e2e42;
            border-top-color: #7c6dfa;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #sp-error {
            color: #f87171;
            font-size: 12px;
            padding: 4px 0;
        }

        #player-wrap.custom-hls #videoPlayer {
            cursor: pointer;
        }

        #hls-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 15;
            padding: 34px 14px 10px;
            background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 45%, transparent 100%);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .2s ease, transform .2s ease;
            pointer-events: none;
        }

        #player-wrap.controls-visible #hls-controls,
        #player-wrap.controls-paused #hls-controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        #hls-seek-row {
            position: relative;
            height: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 8px;
        }

        #hls-seek-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,.18);
            border-radius: 3px;
            overflow: hidden;
        }

        #hls-buffered {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0%;
            background: rgba(255,255,255,.32);
            border-radius: 3px;
        }

        #hls-progress {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0%;
            background: #7c6dfa;
            border-radius: 3px;
        }

        #hls-seek-thumb {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            box-shadow: 0 0 0 3px rgba(124,109,250,.35);
            opacity: 0;
            transition: opacity .15s;
        }

        #hls-seek-row:hover #hls-seek-thumb {
            opacity: 1;
        }

        #hls-controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hls-btn {
            background: none;
            border: none;
            color: #e2e2e8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: background .15s, color .15s;
        }

        .hls-btn:hover {
            background: rgba(255,255,255,.12);
            color: #fff;
        }

        #hls-time {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        #hls-vol-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        #hls-vol-slider {
            width: 70px;
            accent-color: #7c6dfa;
            cursor: pointer;
        }

        .hls-spacer { flex: 1; }

        .hls-menu-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .hls-menu {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: #13131a;
            border: 1px solid #2e2e42;
            border-radius: 10px;
            padding: 6px;
            min-width: 130px;
            max-height: 220px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,.6);
            display: none;
        }

        .hls-menu.visible { display: block; }

        .hls-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #ccc;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
        }

        .hls-menu-item:hover {
            background: rgba(124,109,250,.18);
            color: #fff;
        }

        .hls-menu-item.active {
            color: #fff;
            background: rgba(124,109,250,.28);
        }

        #hls-center-play {
            position: absolute;
            inset: 0;
            z-index: 12;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0,0,0,.25);
        }

        #hls-center-play.show { display: flex; }

        #hls-center-play .circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(19,19,26,.75);
            border: 1px solid rgba(124,109,250,.5);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: transform .15s;
        }

        #hls-center-play:hover .circle {
            transform: scale(1.08);
        }

        #hls-buffer-spinner {
            position: absolute;
            inset: 0;
            z-index: 11;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #hls-buffer-spinner.show { display: flex; }

        #hls-buffer-spinner .spin-lg {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,255,255,.15);
            border-top-color: #7c6dfa;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        #hls-error-overlay {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(10,10,15,.92);
            text-align: center;
            padding: 20px;
        }

        #hls-error-overlay.show { display: flex; }

        #hls-error-overlay p {
            font-size: 13px;
            color: #f87171;
            max-width: 320px;
        }

        #hls-error-overlay button {
            padding: 7px 18px;
            border-radius: 8px;
            border: 1px solid #7c6dfa;
            background: rgba(124,109,250,.18);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        #hls-error-overlay button:hover {
            background: #7c6dfa;
        }

        #hls-live-badge {
            display: none;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            color: #f87171;
            letter-spacing: .04em;
            flex-shrink: 0;
        }

        #hls-live-badge.show { display: flex; }

        #hls-live-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f87171;
        }

        #player-wrap:fullscreen,
        #player-wrap.is-fullscreen {
            background: #000;
        }

        #player-wrap:fullscreen #videoPlayer {
            object-fit: contain;
        }

        #autonext-overlay {
            display: none;
            position: absolute;
            bottom: 28px;
            right: 28px;
            background: rgba(10, 10, 15, .9);
            border: 1px solid #2e2e42;
            border-radius: 14px;
            padding: 14px 20px;
            min-width: 220px;
            z-index: 30;
            backdrop-filter: blur(6px);
        }

        .an-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 6px;
        }

        .an-ep {
            font-size: 15px;
            font-weight: 700;
            color: #e2e2e8;
            margin-bottom: 10px;
        }

        #an-bar-bg {
            width: 100%;
            height: 4px;
            background: #2e2e42;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #an-bar {
            height: 100%;
            width: 100%;
            background: #7c6dfa;
            border-radius: 4px;
            transform-origin: left;
            transition: transform linear;
        }

        .an-btns {
            display: flex;
            gap: 8px;
        }

        .an-btns button {
            flex: 1;
            padding: 6px 0;
            border: none;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
        }

        #an-btn-now {
            background: #7c6dfa;
            color: #fff;
        }

        #an-btn-now:hover {
            background: #6a5be0;
        }

        #an-btn-cancel {
            background: #1e1e2e;
            color: #aaa;
            border: 1px solid #2e2e42;
        }

        #an-btn-cancel:hover {
            background: #2e2e42;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="topbar">
            <div id="topbar-inner">
                <span class="brand">&#9654; OtakuVid</span>

                <div class="field-group">
                    <label>MAL ID</label>
                    <input id="inp-mal" type="number" placeholder="e.g. 21" min="1">
                </div>
                <div class="field-group">
                    <label>Episode</label>
                    <input id="inp-ep" type="number" placeholder="e.g. 1" min="1">
                </div>

                <div id="lang-toggle">
                    <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
                    <button id="btn-sub" onclick="setLang('sub')">SUB</button>
                </div>

                <div id="autonext-wrap">
                    <span>Auto-Next</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-autonext" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="ctrl-btns">
                    <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Prev
                    </button>
                    <button class="bar-btn" id="btn-go" onclick="loadPlayer()">&#9654; Play</button>
                    <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">
                        Next
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                    <div id="extract-spinner" style="display:none; align-items:center; gap:6px; color:#a78bfa; font-size:12px; font-weight:600; background:rgba(167, 139, 250, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(167, 139, 250, 0.25);">
                        <div class="spin"></div>
                        <span>Extracting...</span>
                    </div>
                    <div id="prefetch-status" style="display:none; align-items:center; gap:5px; color:#4ade80; font-size:12px; font-weight:600; background:rgba(74, 222, 128, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(74, 222, 128, 0.25);">
                        <span id="prefetch-icon">✓</span>
                        <span id="prefetch-status-text">+50 Ep Ready</span>
                    </div>
                </div>

                <div id="srv-wrap">
                    <button id="srv-toggle-btn" onclick="toggleServerPanel()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    </button>
                    <div id="server-panel">
                        <div class="sp-row">
                            <span class="sp-title">Servers &amp; Quality</span>
                            <button id="sp-close" onclick="toggleServerPanel()">&#10005;</button>
                        </div>
                        <div id="quality-row"></div>
                        <div id="sp-loading" style="display:none">
                            <div class="spin"></div> Fetching streams&#8230;
                        </div>

    <script>
        const BASE_DATASET_URL = "https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/";
        const DATASET_FILENAMES = ["hianime_streams_list.json"].concat(
            Array.from({ length: 36 }, (_, i) => `hianime_streams_list_${i + 2}.json`)
        );

        let datasetCache = null;
        let hlsInstance = null;
        let currentLang = 'dub';
        let autoNextTimer = null;
        let activeServerStream = null;
        let allExtractedStreams = [];
        let cachedMalId = null;
        let cachedEp = null;
        let _fetchToken = 0;
        const COUNTDOWN_S = 10;

        const streamCache = new Map();
        let preFetchAbortToken = 0;

        function getProxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('https://anivexa.onrender.com/proxy')) return url;
            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.txt')) {
                return `https://anivexa.onrender.com/proxy?url=${encodeURIComponent(url)}&referer=https://otakuvid.online/`;
            }
            return url;
        }

        async function loadAllDatasets() {
            if (datasetCache) return datasetCache;
            try {
                const promises = DATASET_FILENAMES.map(fname =>
                    fetch(BASE_DATASET_URL + fname)
                        .then(r => r.ok ? r.json() : [])
                        .catch(() => [])
                );
                const results = await Promise.all(promises);
                datasetCache = results.flat();
                return datasetCache;
            } catch (err) {
                throw new Error("Failed to load OtakuVid datasets: " + err.message);
            }
        }

        async function searchOtakuVid(malId, epNum) {
            const datasets = await loadAllDatasets();
            const targetMid = String(malId).trim();
            const targetEp = String(epNum).trim();

            return datasets.find(item => {
                const mid = String(item["mal_id/anilist_id/tmdb_id"] || item.mal_id || '').trim();
                const ep = String(item["episode_no"] || item.ep || '').trim();
                return mid === targetMid && ep === targetEp;
            });
        }

        async function fetchHtmlWithProxy(url) {
            const proxyUrls = [];
            if (window.location.origin && window.location.protocol.startsWith('http') && !window.location.origin.includes('github.io')) {
                proxyUrls.push(window.location.origin + `/proxy?url=${encodeURIComponent(url)}`);
            }
            proxyUrls.push(
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            );

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetch(pUrl);
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.length > 50) return text;
                    }
                } catch (e) { }
            }
            throw new Error("Could not fetch page content via proxies");
        }

        function unpackPackedJS(html) {
            const match = html.match(/eval\(function\(p,a,c,k,e,d\).*?'(.*?)',(\d+),(\d+),'(.*?)'\.split\('\|'\)\)\)/s);
            if (!match) return "";
            let payload = match[1];
            const base = parseInt(match[2], 10);
            const count = parseInt(match[3], 10);
            const words = match[4].split("|");

            function unbase(n, b) {
                const chars = "0123456789abcdefghijklmnopqrstuvwxyz";
                let res = "";
                while (n > 0) {
                    res = chars[n % b] + res;
                    n = Math.floor(n / b);
                }
                return res || "0";
            }

            for (let i = count - 1; i >= 0; i--) {
                if (words[i]) {
                    const token = unbase(i, base);
                    const reg = new RegExp('\\b' + token + '\\b', 'g');
                    payload = payload.replace(reg, words[i]);
                }
            }
            return payload;
        }

        async function parseMasterPlaylist(masterUrl, pageUrl) {
            try {
                const proxiedMaster = getProxyUrl(masterUrl);
                const res = await fetch(proxiedMaster);
                if (!res.ok) return [];
                const content = await res.text();

                const base = masterUrl.substring(0, masterUrl.lastIndexOf("/") + 1);
                const variants = [];
                const lines = content.split(/\r?\n/);

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith("#EXT-X-STREAM-INF:")) {
                        const resMatch = line.match(/RESOLUTION=(\d+x\d+)/i);
                        const bwMatch = line.match(/BANDWIDTH=(\d+)/i);
                        const resolution = resMatch ? resMatch[1] : "HD";
                        const bandwidth = bwMatch ? bwMatch[1] : "0";

                        let qLabel = "HD";
                        if (resolution.includes("1920") || resolution.includes("1080")) qLabel = "1080p";
                        else if (resolution.includes("1280") || resolution.includes("720")) qLabel = "720p";
                        else if (resolution.includes("854") || resolution.includes("480")) qLabel = "480p";
                        else if (resolution.includes("640") || resolution.includes("360")) qLabel = "360p";

                        if (i + 1 < lines.length) {
                            const streamPath = lines[i + 1].trim();
                            if (streamPath && !streamPath.startsWith("#")) {
                                const absStream = streamPath.startsWith("http") ? streamPath : base + streamPath;
                                variants.push({
                                    quality: qLabel,
                                    resolution: resolution,
                                    bandwidth: bandwidth,
                                    url: absStream
                                });
                            }
                        }
                    }
                }
                return variants;
            } catch (e) {
                return [];
            }
        }

        async function extractOtakuVidStreams(embedUrl) {
            try {
                const html = await fetchHtmlWithProxy(embedUrl);
                const decodedJs = unpackPackedJS(html);

                let masterUrl = null;
                const m3u8Match = (decodedJs + html).match(/https?:\/\/[^\s"'<>]+?\.(?:m3u8|txt)[^\s"'<>]*/i);
                if (m3u8Match) {
                    masterUrl = m3u8Match[0];
                }

                const variants = masterUrl ? await parseMasterPlaylist(masterUrl, embedUrl) : [];
                return { masterUrl, variants, rawHtml: html };
            } catch (e) {
                return { masterUrl: null, variants: [], error: e.message };
            }
        }

        async function getOtakuVidStreams(malId, epNum) {
            const cacheKey = `${malId}_${epNum}`;
            if (streamCache.has(cacheKey)) {
                return await streamCache.get(cacheKey);
            }

            const fetchPromise = (async () => {
                const matchedEntry = await searchOtakuVid(malId, epNum);
                if (!matchedEntry) throw new Error(`MAL ID ${malId} Episode ${epNum} not found in OtakuVid datasets`);

                const title = matchedEntry.anime_name || matchedEntry.title || `Anime ${malId}`;
                const streams = [];

                const embedEntries = [];
                Object.keys(matchedEntry).forEach(k => {
                    const v = matchedEntry[k];
                    if (typeof v === 'string') {
                        const kLower = String(k).toLowerCase();
                        const vLower = v.toLowerCase();
                        if (vLower.includes("otakuvid.online") || vLower.includes("earnvids") || vLower.includes("oktavid") || kLower.includes("otakuvid") || kLower.includes("oktavid") || kLower.includes("earnvids")) {
                            const isDub = kLower.includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    }
                });

                if (embedEntries.length === 0) {
                    Object.keys(matchedEntry).forEach(k => {
                        const v = matchedEntry[k];
                        if (typeof v === 'string' && v.startsWith("http")) {
                            const isDub = String(k).toLowerCase().includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    });
                }

                for (const emb of embedEntries) {
                    try {
                        const extracted = await extractOtakuVidStreams(emb.url);
                        if (extracted.variants && extracted.variants.length > 0) {
                            extracted.variants.forEach(varItem => {
                                streams.push({
                                    server: `OtakuVid ${emb.lang.toUpperCase()} (${varItem.quality})`,
                                    url: varItem.url,
                                    type: "mp4",
                                    quality: varItem.quality,
                                    lang: emb.lang,
                                    embed_url: emb.url
                                });
                            });
                        } else if (extracted.masterUrl) {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (HD)`,
                                url: extracted.masterUrl,
                                type: "mp4",
                                quality: "HD",
                                lang: emb.lang,
                                embed_url: emb.url
                            });
                        } else {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                                url: emb.url,
                                type: "iframe",
                                quality: "Embed",
                                lang: emb.lang
                            });
                        }
                    } catch (e) {
                        streams.push({
                            server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                            url: emb.url,
                            type: "iframe",
                            quality: "Embed",
                            lang: emb.lang
                        });
                    }
                }

                return {
                    status: "success",
                    server: "OtakuVid",
                    malId: parseInt(malId),
                    episode: parseInt(epNum),
                    animeTitle: title,
                    results: {
                        stream_url: streams.length > 0 ? streams[0].url : null,
                        streams: streams
                    }
                };
            })();

            streamCache.set(cacheKey, fetchPromise);
            return await fetchPromise;
        }

        async function preExtractNextEpisodes(malId, currentEpNum, totalToFetch = 50) {
            const myPrefetchToken = ++preFetchAbortToken;
            const startEp = parseInt(currentEpNum, 10) + 1;
            const statusEl = document.getElementById('prefetch-status');
            const statusIcon = document.getElementById('prefetch-icon');
            const statusText = document.getElementById('prefetch-status-text');

            const endEp = startEp + totalToFetch - 1;
            const targetCount = totalToFetch;

            if (statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#a78bfa';
                statusEl.style.background = 'rgba(167, 139, 250, 0.12)';
                statusEl.style.borderColor = 'rgba(167, 139, 250, 0.25)';
                if (statusIcon) statusIcon.textContent = '⚡';
                statusText.textContent = `Pre-extracting +${targetCount} Ep...`;
            }

            let fetchedCount = 0;
            for (let ep = startEp; ep <= endEp; ep++) {
                if (myPrefetchToken !== preFetchAbortToken) return;

                const cacheKey = `${malId}_${ep}`;
                if (!streamCache.has(cacheKey)) {
                    try {
                        await getOtakuVidStreams(malId, ep);
                        if (myPrefetchToken !== preFetchAbortToken) return;
                    } catch (e) {
                        // Silently handle background prefetch errors
                    }
                    await new Promise(r => setTimeout(r, 350));
                }
                fetchedCount++;
                if (statusText && myPrefetchToken === preFetchAbortToken) {
                    statusText.textContent = `Pre-extracting (${fetchedCount}/${targetCount})...`;
                }
            }

            if (myPrefetchToken === preFetchAbortToken && statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#4ade80';
                statusEl.style.background = 'rgba(74, 222, 128, 0.12)';
                statusEl.style.borderColor = 'rgba(74, 222, 128, 0.25)';
                if (statusIcon) statusIcon.textContent = '✓';
                statusText.textContent = `+${targetCount} Ep Ready`;
            }
        }

        function toggleBar() {
            const inner = document.getElementById('topbar-inner');
            const btn = document.getElementById('toggle-bar-btn');
            btn.classList.toggle('open', inner.classList.toggle('open'));
        }

        function toggleServerPanel() {
            const panel = document.getElementById('server-panel');
            const btn = document.getElementById('srv-toggle-btn');
            btn.classList.toggle('open', panel.classList.toggle('visible'));
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');

            const malId = String(document.getElementById('inp-mal').value).trim();
            const ep = String(document.getElementById('inp-ep').value).trim();

            if (allExtractedStreams && allExtractedStreams.length > 0 && cachedMalId === malId && cachedEp === ep) {
                const best = getBestHdStream(allExtractedStreams, lang);
                if (best) {
                    playStream(best);
                    renderServerPanel(allExtractedStreams);
                } else {
                    showPlayer(malId, ep, lang);
                }
            } else if (malId && ep) {
                showPlayer(malId, ep, lang);
            }
        }

        function playStream(stream) {
            activeServerStream = stream;
            const placeholder = document.getElementById('placeholder');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('player-iframe');

            placeholder.style.display = 'none';

            if (!stream) return;

            if (stream.type === 'iframe') {
                video.style.display = 'none';
                video.pause();
                iframe.src = stream.url;
                iframe.style.display = 'block';
                return;
            }

            iframe.style.display = 'none';
            iframe.src = 'about:blank';
            video.style.display = 'block';
            document.getElementById('player-wrap').classList.add('custom-hls');
            hideHlsError();

            const proxiedUrl = getProxyUrl(stream.url);
            currentStreamUrl = proxiedUrl;

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            if (proxiedUrl.includes('.m3u8') || proxiedUrl.includes('.txt') || (stream.url && stream.url.includes('.txt'))) {
                initAdvancedHls(video, proxiedUrl);
            } else {
                video.src = proxiedUrl;
                video.play().catch(() => { video.muted = true; hlsSyncMuteIcon(); video.play(); });
            }

            video.onended = () => {
                const malId = document.getElementById('inp-mal').value.trim();
                const ep = document.getElementById('inp-ep').value.trim();
                if (malId && ep) triggerAutoNext(malId, ep, currentLang);
            };
        }

        // ===================== Advanced HLS Player =====================
        let currentStreamUrl = null;
        let hlsRetryCount = 0;
        let hlsControlsHideTimer = null;
        const HLS_PLAYBACK_RATES = [0.5, 0.75, 1, 1.25, 1.5, 2];

        function initAdvancedHls(video, url) {
            hlsRetryCount = 0;
            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                    maxBufferSize: 60 * 1000 * 1000,
                    maxBufferHole: 0.5,
                    liveSyncDurationCount: 3,
                    fragLoadingMaxRetry: 6,
                    manifestLoadingMaxRetry: 6,
                    levelLoadingMaxRetry: 6
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    buildQualityMenu();
                    video.play().catch(() => { video.muted = true; hlsSyncMuteIcon(); video.play(); });
                });

                hlsInstance.on(Hls.Events.LEVEL_SWITCHED, () => buildQualityMenu());

                hlsInstance.on(Hls.Events.ERROR, (evt, data) => {
                    if (!data.fatal) return;
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            if (hlsRetryCount < 4) {
                                hlsRetryCount++;
                                hlsInstance.startLoad();
                            } else {
                                showHlsError('Network error loading stream.');
                            }
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            if (hlsRetryCount < 4) {
                                hlsRetryCount++;
                                hlsInstance.recoverMediaError();
                            } else {
                                showHlsError('Media decoding error.');
                            }
                            break;
                        default:
                            showHlsError('Unable to play this stream.');
                            hlsInstance.destroy();
                            hlsInstance = null;
                            break;
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(() => { video.muted = true; hlsSyncMuteIcon(); video.play(); });
                }, { once: true });
                document.getElementById('hls-quality-menu').innerHTML = '<div class="hls-menu-item active">Auto</div>';
            } else {
                showHlsError('HLS playback is not supported in this browser.');
            }
        }

        function hlsRetry() {
            hideHlsError();
            if (activeServerStream) playStream(activeServerStream);
        }

        function showHlsError(msg) {
            const ov = document.getElementById('hls-error-overlay');
            document.getElementById('hls-error-msg').textContent = msg;
            ov.classList.add('show');
            document.getElementById('hls-buffer-spinner').classList.remove('show');
        }

        function hideHlsError() {
            document.getElementById('hls-error-overlay').classList.remove('show');
        }

        function buildQualityMenu() {
            const menu = document.getElementById('hls-quality-menu');
            if (!menu || !hlsInstance) return;
            menu.innerHTML = '';

            const autoItem = document.createElement('div');
            autoItem.className = 'hls-menu-item' + (hlsInstance.currentLevel === -1 ? ' active' : '');
            autoItem.innerHTML = `<span>Auto</span>` + (hlsInstance.currentLevel === -1 ? `<span style="color:#7c6dfa">(${hlsInstance.levels[hlsInstance.currentLevel]?.height || ''}p)</span>` : '');
            autoItem.onclick = () => { hlsInstance.currentLevel = -1; buildQualityMenu(); hlsCloseMenus(); };
            menu.appendChild(autoItem);

            const levels = hlsInstance.levels.map((lvl, idx) => ({ idx, height: lvl.height, bitrate: lvl.bitrate }))
                .sort((a, b) => b.height - a.height);

            levels.forEach(lvl => {
                const item = document.createElement('div');
                const isActive = hlsInstance.currentLevel === lvl.idx;
                item.className = 'hls-menu-item' + (isActive ? ' active' : '');
                item.innerHTML = `<span>${lvl.height}p</span>`;
                item.onclick = () => { hlsInstance.currentLevel = lvl.idx; buildQualityMenu(); hlsCloseMenus(); };
                menu.appendChild(item);
            });
        }

        function buildSpeedMenu() {
            const menu = document.getElementById('hls-speed-menu');
            if (!menu) return;
            menu.innerHTML = '';
            const video = document.getElementById('videoPlayer');
            HLS_PLAYBACK_RATES.forEach(rate => {
                const item = document.createElement('div');
                item.className = 'hls-menu-item' + (video.playbackRate === rate ? ' active' : '');
                item.textContent = rate === 1 ? 'Normal' : rate + 'x';
                item.onclick = () => {
                    video.playbackRate = rate;
                    buildSpeedMenu();
                    hlsCloseMenus();
                };
                menu.appendChild(item);
            });
        }

        function hlsToggleMenu(id) {
            const menu = document.getElementById(id);
            const wasVisible = menu.classList.contains('visible');
            hlsCloseMenus();
            if (!wasVisible) {
                if (id === 'hls-speed-menu') buildSpeedMenu();
                menu.classList.add('visible');
            }
        }

        function hlsCloseMenus() {
            document.querySelectorAll('.hls-menu').forEach(m => m.classList.remove('visible'));
        }

        function hlsTogglePlay() {
            const video = document.getElementById('videoPlayer');
            if (video.paused || video.ended) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        function hlsSkip(sec) {
            const video = document.getElementById('videoPlayer');
            if (!isFinite(video.duration)) return;
            video.currentTime = Math.min(Math.max(0, video.currentTime + sec), video.duration || video.currentTime + sec);
        }

        function hlsFormatTime(t) {
            if (!isFinite(t) || t < 0) return '0:00';
            const h = Math.floor(t / 3600);
            const m = Math.floor((t % 3600) / 60);
            const s = Math.floor(t % 60);
            const mm = h > 0 ? String(m).padStart(2, '0') : String(m);
            const ss = String(s).padStart(2, '0');
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function hlsSeekClick(e) {
            const video = document.getElementById('videoPlayer');
            if (!isFinite(video.duration)) return;
            const rect = document.getElementById('hls-seek-track').getBoundingClientRect();
            const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            video.currentTime = pct * video.duration;
        }

        function hlsSeekHover(e) {
            const rect = document.getElementById('hls-seek-track').getBoundingClientRect();
            const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            document.getElementById('hls-seek-thumb').style.left = (pct * 100) + '%';
        }

        function hlsToggleMute() {
            const video = document.getElementById('videoPlayer');
            video.muted = !video.muted;
            if (!video.muted && video.volume === 0) video.volume = 0.5;
            document.getElementById('hls-vol-slider').value = video.muted ? 0 : video.volume;
            hlsSyncMuteIcon();
        }

        function hlsSetVolume(v) {
            const video = document.getElementById('videoPlayer');
            video.volume = parseFloat(v);
            video.muted = parseFloat(v) === 0;
            hlsSyncMuteIcon();
        }

        function hlsSyncMuteIcon() {
            const video = document.getElementById('videoPlayer');
            const icon = document.getElementById('hls-vol-icon');
            const muted = video.muted || video.volume === 0;
            icon.innerHTML = muted
                ? '<path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/>'
                : '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';
        }

        function hlsTogglePip() {
            const video = document.getElementById('videoPlayer');
            if (document.pictureInPictureElement) {
                document.exitPictureInPicture().catch(() => {});
            } else if (document.pictureInPictureEnabled) {
                video.requestPictureInPicture().catch(() => {});
            }
        }

        function hlsToggleFullscreen() {
            const wrap = document.getElementById('player-wrap');
            if (!document.fullscreenElement) {
                wrap.requestFullscreen?.().catch(() => {});
            } else {
                document.exitFullscreen?.();
            }
        }

        function hlsShowControls() {
            const wrap = document.getElementById('player-wrap');
            wrap.classList.add('controls-visible');
            clearTimeout(hlsControlsHideTimer);
            const video = document.getElementById('videoPlayer');
            if (!video.paused) {
                hlsControlsHideTimer = setTimeout(() => {
                    wrap.classList.remove('controls-visible');
                    hlsCloseMenus();
                }, 3000);
            }
        }

        function setupAdvancedHlsControls() {
            const video = document.getElementById('videoPlayer');
            const wrap = document.getElementById('player-wrap');

            video.addEventListener('click', () => hlsTogglePlay());
            video.addEventListener('dblclick', () => hlsToggleFullscreen());

            video.addEventListener('play', () => {
                wrap.classList.add('controls-paused');
                wrap.classList.remove('controls-paused');
                document.getElementById('hls-play-icon').innerHTML = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
                document.getElementById('hls-center-play').classList.remove('show');
                hlsShowControls();
            });

            video.addEventListener('pause', () => {
                document.getElementById('hls-play-icon').innerHTML = '<polygon points="6 3 21 12 6 21 6 3"/>';
                document.getElementById('hls-center-play').classList.add('show');
                wrap.classList.add('controls-paused');
                clearTimeout(hlsControlsHideTimer);
            });

            video.addEventListener('waiting', () => document.getElementById('hls-buffer-spinner').classList.add('show'));
            video.addEventListener('playing', () => {
                document.getElementById('hls-buffer-spinner').classList.remove('show');
                wrap.classList.remove('controls-paused');
            });
            video.addEventListener('canplay', () => document.getElementById('hls-buffer-spinner').classList.remove('show'));

            video.addEventListener('timeupdate', () => {
                if (!isFinite(video.duration)) {
                    document.getElementById('hls-live-badge').classList.add('show');
                    document.getElementById('hls-time').textContent = 'LIVE';
                    return;
                }
                document.getElementById('hls-live-badge').classList.remove('show');
                const pct = (video.currentTime / video.duration) * 100;
                document.getElementById('hls-progress').style.width = pct + '%';
                document.getElementById('hls-time').textContent = `${hlsFormatTime(video.currentTime)} / ${hlsFormatTime(video.duration)}`;
            });

            video.addEventListener('progress', () => {
                if (video.buffered.length && isFinite(video.duration)) {
                    const end = video.buffered.end(video.buffered.length - 1);
                    document.getElementById('hls-buffered').style.width = ((end / video.duration) * 100) + '%';
                }
            });

            video.addEventListener('volumechange', hlsSyncMuteIcon);
            document.getElementById('hls-vol-slider').addEventListener('input', function () { hlsSetVolume(this.value); });

            document.addEventListener('fullscreenchange', () => {
                wrap.classList.toggle('is-fullscreen', !!document.fullscreenElement);
            });

            wrap.addEventListener('mousemove', hlsShowControls);
            wrap.addEventListener('mouseleave', () => {
                if (!video.paused) {
                    clearTimeout(hlsControlsHideTimer);
                    wrap.classList.remove('controls-visible');
                    hlsCloseMenus();
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.hls-menu-wrap')) hlsCloseMenus();
            });

            document.addEventListener('keydown', (e) => {
                if (video.style.display === 'none') return;
                const tag = (document.activeElement && document.activeElement.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                switch (e.code) {
                    case 'Space': e.preventDefault(); hlsTogglePlay(); break;
                    case 'ArrowRight': hlsSkip(5); break;
                    case 'ArrowLeft': hlsSkip(-5); break;
                    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); document.getElementById('hls-vol-slider').value = video.volume; break;
                    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); document.getElementById('hls-vol-slider').value = video.volume; break;
                    case 'KeyM': hlsToggleMute(); break;
                    case 'KeyF': hlsToggleFullscreen(); break;
                    case 'KeyP': hlsTogglePip(); break;
                }
            });
        }

        function renderServerPanel(streams) {
            const qRow = document.getElementById('quality-row');
            const srvList = document.getElementById('server-list');
            const spLoad = document.getElementById('sp-loading');
            const spErr = document.getElementById('sp-error');
            const srvBtn = document.getElementById('srv-toggle-btn');

            spLoad.style.display = 'none';
            spErr.style.display = 'none';
            qRow.innerHTML = '';
            srvList.innerHTML = '';

            if (!streams || !streams.length) {
                spErr.style.display = 'block';
                spErr.textContent = 'No streams found for this episode.';
                if (srvBtn) {
                    srvBtn.innerHTML = `
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    `;
                }
                return;
            }

            const qualSet = new Set(["1080p", "720p", "480p", "360p"]);
            streams.forEach(s => { if (s.quality && s.quality !== 'Embed') qualSet.add(s.quality); });

            Array.from(qualSet).forEach(q => {
                let matchingStream = streams.find(s => s.lang === currentLang && ((s.quality || '').includes(q) || (s.server || '').includes(q)));
                if (!matchingStream) {
                    matchingStream = streams.find(s => (s.quality || '').includes(q) || (s.server || '').includes(q));
                }

                const pill = document.createElement('button');
                const isActive = (matchingStream && activeServerStream === matchingStream);
                pill.className = 'q-pill' + (isActive ? ' active' : '') + (matchingStream ? '' : ' unavail');
                pill.textContent = q;
                if (matchingStream) {
                    pill.onclick = () => {
                        document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                        playStream(matchingStream);
                        if (matchingStream.lang) {
                            currentLang = matchingStream.lang;
                            document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                            document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                        }
                        renderServerPanel(allExtractedStreams);
                    };
                }
                qRow.appendChild(pill);
            });

            const sortedStreams = [...streams].sort((a, b) => {
                if (a.lang === currentLang && b.lang !== currentLang) return -1;
                if (a.lang !== currentLang && b.lang === currentLang) return 1;
                return 0;
            });

            sortedStreams.forEach((st, idx) => {
                const btn = document.createElement('button');
                const isCurrentActive = (activeServerStream === st || (!activeServerStream && idx === 0));
                btn.className = 'srv-btn' + (isCurrentActive ? ' active' : '');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = st.server || `OtakuVid Server ${idx + 1}`;
                btn.appendChild(nameSpan);

                const badgeText = (st.quality || '') + (st.lang ? ` ${st.lang.toUpperCase()}` : '');
                if (badgeText.trim()) {
                    const badge = document.createElement('span');
                    badge.className = 'srv-badge';
                    badge.textContent = badgeText.trim();
                    btn.appendChild(badge);
                }

                btn.onclick = () => {
                    document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playStream(st);
                    if (st.lang) {
                        currentLang = st.lang;
                        document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                        document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                    }
                    renderServerPanel(allExtractedStreams);
                };

                srvList.appendChild(btn);
            });

            if (srvBtn) {
                const activeRes = activeServerStream ? `${activeServerStream.quality} ${activeServerStream.lang ? activeServerStream.lang.toUpperCase() : ''}` : '';
                srvBtn.innerHTML = `
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="4" rx="1" />
                        <rect x="2" y="10" width="20" height="4" rx="1" />
                        <rect x="2" y="17" width="20" height="4" rx="1" />
                    </svg>
                    Servers (${activeRes.trim() ? activeRes.trim() : streams.length + ' Streams'})
                `;
            }
        }

        function getBestHdStream(streams, preferredLang = 'dub') {
            if (!streams || streams.length === 0) return null;
            const priority = ["1080p", "720p", "480p", "360p"];

            const prefStreams = streams.filter(s => s.lang === preferredLang);
            if (prefStreams.length > 0) {
                for (const res of priority) {
                    const found = prefStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return prefStreams[0];
            }

            const altLang = preferredLang === 'dub' ? 'sub' : 'dub';
            const altStreams = streams.filter(s => s.lang === altLang);
            if (altStreams.length > 0) {
                for (const res of priority) {
                    const found = altStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return altStreams[0];
            }

            for (const res of priority) {
                const found = streams.find(s => (s.quality || s.server || '').includes(res));
                if (found) return found;
            }
            return streams[0];
        }

        async function showPlayer(malId, ep, lang = 'dub') {
            cancelAutoNext();
            currentLang = lang;
            const myToken = ++_fetchToken;

            document.getElementById('inp-mal').value = malId;
            document.getElementById('inp-ep').value = ep;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');

            document.title = `OtakuVid · MAL ${malId} · Ep ${ep} · ${lang.toUpperCase()}`;

            const spinner = document.getElementById('extract-spinner');
            const prefetchStatus = document.getElementById('prefetch-status');
            if (spinner) spinner.style.display = 'flex';
            if (prefetchStatus) prefetchStatus.style.display = 'none';

            document.getElementById('srv-toggle-btn').classList.add('show');
            document.getElementById('quality-row').innerHTML = '';
            document.getElementById('server-list').innerHTML = '';
            document.getElementById('sp-error').style.display = 'none';
            document.getElementById('sp-loading').style.display = 'flex';

            try {
                const data = await getOtakuVidStreams(malId, ep);
                if (myToken !== _fetchToken) return;

                document.getElementById('sp-loading').style.display = 'none';

                const streams = data.results.streams || [];
                allExtractedStreams = streams;
                cachedMalId = String(malId);
                cachedEp = String(ep);

                if (streams.length > 0) {
                    const best = getBestHdStream(streams, lang);
                    playStream(best);
                    renderServerPanel(streams);

                    preExtractNextEpisodes(malId, ep, 50);
                } else {
                    document.getElementById('sp-error').style.display = 'block';
                    document.getElementById('sp-error').textContent = `No streams available for MAL ${malId} Ep ${ep}.`;
                }
            } catch (err) {
                if (myToken !== _fetchToken) return;
                document.getElementById('sp-loading').style.display = 'none';
                document.getElementById('sp-error').style.display = 'block';
                document.getElementById('sp-error').textContent = 'Error: ' + err.message;
            } finally {
                if (myToken === _fetchToken && spinner) {
                    spinner.style.display = 'none';
                }
            }
        }

        function loadPlayer() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = document.getElementById('inp-ep').value.trim();
            if (!malId || !ep) { alert('Please enter both MAL ID and episode number.'); return; }
            showPlayer(malId, ep, currentLang);
        }

        function goPrevEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep) || ep <= 1) return;
            showPlayer(malId, ep - 1, currentLang);
        }

        function goNextEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function triggerAutoNext(malId, ep, lang) {
            if (!document.getElementById('chk-autonext').checked) return;
            const nextEp = parseInt(ep, 10) + 1;
            document.getElementById('an-ep-label').textContent = `Episode ${nextEp}`;
            const overlay = document.getElementById('autonext-overlay');
            const bar = document.getElementById('an-bar');
            overlay.style.display = 'block';
            bar.style.transition = 'none';
            bar.style.transform = 'scaleX(1)';
            bar.getBoundingClientRect();
            bar.style.transition = `transform ${COUNTDOWN_S}s linear`;
            bar.style.transform = 'scaleX(0)';
            let remaining = COUNTDOWN_S;
            autoNextTimer = setInterval(() => { if (--remaining <= 0) goNextNow(); }, 1000);
        }

        function goNextNow() {
            cancelAutoNext();
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function cancelAutoNext() {
            clearInterval(autoNextTimer);
            autoNextTimer = null;
            const overlay = document.getElementById('autonext-overlay');
            if (overlay) overlay.style.display = 'none';
        }

        function parseParamsFromUrl() {
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            const pathMatch = path.match(/\/(\d+)\/(\d+)(?:\/(dub|sub))?\/?$/i);
            if (pathMatch) {
                return { malId: pathMatch[1], epNum: pathMatch[2], lang: pathMatch[3] || 'dub' };
            }

            const queryDirectMatch = search.match(/\?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (queryDirectMatch) {
                return { malId: queryDirectMatch[1], epNum: queryDirectMatch[2], lang: queryDirectMatch[3] || 'dub' };
            }

            const searchParams = new URLSearchParams(search);
            const qMal = searchParams.get('mal_id') || searchParams.get('malId') || searchParams.get('id');
            const qEp = searchParams.get('ep') || searchParams.get('ep_num') || searchParams.get('episode');
            const qLang = searchParams.get('lang') || searchParams.get('type');
            if (qMal && qEp) {
                return { malId: qMal, epNum: qEp, lang: qLang || 'dub' };
            }

            const hashMatch = hash.match(/#\/?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (hashMatch) {
                return { malId: hashMatch[1], epNum: hashMatch[2], lang: hashMatch[3] || 'dub' };
            }

            return null;
        }

        window.OtakuVidAPI = {
            getStreams: getOtakuVidStreams,
            search: searchOtakuVid,
            loadDatasets: loadAllDatasets,
            getProxyUrl: getProxyUrl
        };

        window.addEventListener('DOMContentLoaded', () => {
            setupAdvancedHlsControls();
            const params = parseParamsFromUrl();
            if (params) {
                showPlayer(params.malId, params.epNum, params.lang);
            }
        });
    </script>
