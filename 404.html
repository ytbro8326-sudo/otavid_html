<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVid Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #topbar-container {
            width: 100%;
            background: #1f2833;
            border-bottom: 1px solid #1f2833;
            z-index: 1000;
            position: relative;
        }

        #topbar-inner {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: #141c24;
        }

        #topbar-inner.open {
            max-height: 500px;
        }

        .bar-content {
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #66fcf1;
        }

        .field-group input {
            background: #0b0c10;
            border: 1px solid #45a29e;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 90px;
            outline: none;
        }

        .field-group input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.3);
        }

        #lang-toggle {
            display: flex;
            background: #0b0c10;
            border-radius: 6px;
            padding: 2px;
            border: 1px solid #1f2833;
        }

        #lang-toggle button {
            background: transparent;
            border: none;
            color: #c5c6c7;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        #lang-toggle button.active {
            background: #45a29e;
            color: #0b0c10;
        }

        #autonext-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0b0c10;
            transition: .3s;
            border-radius: 20px;
            border: 1px solid #45a29e;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #c5c6c7;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #45a29e;
        }

        input:checked+.slider:before {
            transform: translateX(16px);
            background-color: #0b0c10;
        }

        .ctrl-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .bar-btn {
            background: #1f2833;
            border: 1px solid #45a29e;
            color: #66fcf1;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bar-btn:hover {
            background: #45a29e;
            color: #0b0c10;
        }

        #srv-wrap {
            margin-left: auto;
            position: relative;
        }

        #srv-toggle-btn {
            background: #1f2833;
            border: 1px solid #45a29e;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
        }

        #srv-toggle-btn.show {
            display: flex;
        }

        #srv-toggle-btn.open {
            background: #45a29e;
            color: #0b0c10;
        }

        #server-panel {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            width: 300px;
            background: #141c24;
            border: 1px solid #45a29e;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        #server-panel.visible {
            display: block;
        }

        .sp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .sp-title {
            font-size: 12px;
            font-weight: 700;
            color: #66fcf1;
            text-transform: uppercase;
        }

        #sp-close {
            background: transparent;
            border: none;
            color: #c5c6c7;
            cursor: pointer;
        }

        #quality-row {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .q-pill {
            background: #0b0c10;
            border: 1px solid #1f2833;
            color: #c5c6c7;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .q-pill.active {
            border-color: #66fcf1;
            color: #66fcf1;
            background: rgba(102, 252, 241, 0.1);
        }

        .q-pill.unavail {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #server-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }

        .srv-btn {
            background: #0b0c10;
            border: 1px solid #1f2833;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .srv-btn:hover,
        .srv-btn.active {
            border-color: #45a29e;
            background: #1f2833;
        }

        .srv-badge {
            font-size: 10px;
            background: #45a29e;
            color: #0b0c10;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        #player-wrap {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #toggle-bar-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        #toggle-bar-btn svg {
            transition: transform 0.3s;
        }

        #toggle-bar-btn.open svg {
            transform: rotate(180deg);
        }

        video,
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #placeholder {
            text-align: center;
            color: #45a29e;
        }

        #placeholder p {
            margin-top: 8px;
            font-size: 14px;
            color: #c5c6c7;
        }

        #autonext-overlay {
            display: none;
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(20, 28, 36, 0.95);
            border: 1px solid #45a29e;
            border-radius: 8px;
            padding: 16px;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 3000;
        }

        .an-title {
            font-size: 11px;
            color: #66fcf1;
            text-transform: uppercase;
            font-weight: 700;
        }

        .an-ep {
            font-size: 14px;
            color: #fff;
            margin: 4px 0 12px;
            font-weight: 600;
        }

        #an-bar-bg {
            height: 4px;
            background: #0b0c10;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #an-bar {
            height: 100%;
            background: #66fcf1;
            width: 100%;
            transform-origin: left;
        }

        .an-btns {
            display: flex;
            gap: 8px;
        }

        .an-btns button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        #an-btn-now {
            background: #45a29e;
            color: #0b0c10;
        }

        #an-btn-cancel {
            background: #1f2833;
            color: #c5c6c7;
        }

        .spin {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-left-color: #a78bfa;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="topbar-container">
        <div id="topbar-inner">
            <div class="bar-content">

                <div class="field-group">
                    <label>MAL ID</label>
                    <input id="inp-mal" type="number" placeholder="e.g. 21" min="1">
                </div>

                <div class="field-group">
                    <label>Episode</label>
                    <input id="inp-ep" type="number" placeholder="e.g. 1" min="1">
                </div>

                <div id="lang-toggle">
                    <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
                    <button id="btn-sub" onclick="setLang('sub')">SUB</button>
                </div>

                <div id="autonext-wrap">
                    <span>Auto-Next</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-autonext" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="ctrl-btns">
                    <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        Prev
                    </button>
                    <button class="bar-btn" id="btn-go" onclick="loadPlayer()">&#9654; Play</button>
                    <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">
                        Next
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6" />
                        </svg>
                    </button>
                    <div id="extract-spinner" style="display:none; align-items:center; gap:6px; color:#a78bfa; font-size:12px; font-weight:600; background:rgba(167, 139, 250, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(167, 139, 250, 0.25);">
                        <div class="spin"></div>
                        <span>Extracting...</span>
                    </div>
                    <div id="prefetch-status" style="display:none; align-items:center; gap:5px; color:#4ade80; font-size:12px; font-weight:600; background:rgba(74, 222, 128, 0.12); padding:5px 12px; border-radius:8px; border:1px solid rgba(74, 222, 128, 0.25);">
                        <span id="prefetch-icon">✓</span>
                        <span id="prefetch-status-text">+50 Ep Ready</span>
                    </div>
                </div>

                <div id="srv-wrap">
                    <button id="srv-toggle-btn" onclick="toggleServerPanel()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    </button>
                    <div id="server-panel">
                        <div class="sp-row">
                            <span class="sp-title">Servers &amp; Quality</span>
                            <button id="sp-close" onclick="toggleServerPanel()">&#10005;</button>
                        </div>
                        <div id="quality-row"></div>
                        <div id="sp-loading" style="display:none">
                            <div class="spin"></div> Fetching streams&#8230;
                        </div>
                        <div id="sp-error" style="display:none"></div>
                        <div id="server-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="player-wrap">
            <button id="toggle-bar-btn" onclick="toggleBar()" title="Toggle controls">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#aaa" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 8 11 13 6" />
                </svg>
            </button>

            <div id="placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                    <circle cx="12" cy="12" r="10" />
                    <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
                </svg>
                <p>Click &#8964; top-right to open controls</p>
                <p class="hint">Enter MAL ID + Episode then press Play</p>
            </div>

            <video id="videoPlayer" controls autoplay style="display:none;"></video>
            <iframe id="player-iframe" allow="autoplay; fullscreen" allowfullscreen style="display:none;"></iframe>

            <div id="autonext-overlay">
                <div class="an-title">Up next</div>
                <div class="an-ep" id="an-ep-label">Episode &#8212;</div>
                <div id="an-bar-bg">
                    <div id="an-bar"></div>
                </div>
                <div class="an-btns">
                    <button id="an-btn-now" onclick="goNextNow()">Play Now</button>
                    <button id="an-btn-cancel" onclick="cancelAutoNext()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_DATASET_URL = "https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/";
        const DATASET_FILENAMES = ["hianime_streams_list.json"].concat(
            Array.from({ length: 36 }, (_, i) => `hianime_streams_list_${i + 2}.json`)
        );

        let datasetCache = null;
        let hlsInstance = null;
        let currentLang = 'dub';
        let autoNextTimer = null;
        let activeServerStream = null;
        let allExtractedStreams = [];
        let cachedMalId = null;
        let cachedEp = null;
        let _fetchToken = 0;
        const COUNTDOWN_S = 10;

        const streamCache = new Map();
        let preFetchAbortToken = 0;

        function getProxyUrl(url) {
            if (!url) return '';
            if (url.startsWith('https://anivexa.onrender.com/proxy')) return url;
            return `https://anivexa.onrender.com/proxy?url=${encodeURIComponent(url)}&referer=https://otakuvid.online/`;
        }

        async function loadAllDatasets() {
            if (datasetCache) return datasetCache;
            try {
                const promises = DATASET_FILENAMES.map(fname =>
                    fetch(BASE_DATASET_URL + fname)
                        .then(r => r.ok ? r.json() : [])
                        .catch(() => [])
                );
                const results = await Promise.all(promises);
                datasetCache = results.flat();
                return datasetCache;
            } catch (err) {
                throw new Error("Failed to load OtakuVid datasets: " + err.message);
            }
        }

        async function searchOtakuVid(malId, epNum) {
            const datasets = await loadAllDatasets();
            const targetMid = String(malId).trim();
            const targetEp = String(epNum).trim();

            return datasets.find(item => {
                const mid = String(item["mal_id/anilist_id/tmdb_id"] || item.mal_id || '').trim();
                const ep = String(item["episode_no"] || item.ep || '').trim();
                return mid === targetMid && ep === targetEp;
            });
        }

        async function fetchHtmlWithProxy(url) {
            const proxyUrls = [];
            if (window.location.origin && window.location.protocol.startsWith('http') && !window.location.origin.includes('github.io')) {
                proxyUrls.push(window.location.origin + `/proxy?url=${encodeURIComponent(url)}`);
            }
            proxyUrls.push(
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            );

            for (const pUrl of proxyUrls) {
                try {
                    const res = await fetch(pUrl);
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.length > 50) return text;
                    }
                } catch (e) { }
            }
            throw new Error("Could not fetch page content via proxies");
        }

        function unpackPackedJS(html) {
            const match = html.match(/eval\(function\(p,a,c,k,e,d\).*?'(.*?)',(\d+),(\d+),'(.*?)'\.split\('\|'\)\)\)/s);
            if (!match) return "";
            let payload = match[1];
            const base = parseInt(match[2], 10);
            const count = parseInt(match[3], 10);
            const words = match[4].split("|");

            function unbase(n, b) {
                const chars = "0123456789abcdefghijklmnopqrstuvwxyz";
                let res = "";
                while (n > 0) {
                    res = chars[n % b] + res;
                    n = Math.floor(n / b);
                }
                return res || "0";
            }

            for (let i = count - 1; i >= 0; i--) {
                if (words[i]) {
                    const token = unbase(i, base);
                    const reg = new RegExp('\\b' + token + '\\b', 'g');
                    payload = payload.replace(reg, words[i]);
                }
            }
            return payload;
        }

        async function parseMasterPlaylist(masterUrl, pageUrl) {
            try {
                const proxiedMaster = getProxyUrl(masterUrl);
                const res = await fetch(proxiedMaster);
                if (!res.ok) return [];
                const content = await res.text();

                const base = masterUrl.rsplit ? masterUrl.rsplit("/", 1)[0] + "/" : masterUrl.substring(0, masterUrl.lastIndexOf("/") + 1);
                const variants = [];
                const lines = content.splitlines ? content.splitlines() : content.split(/\r?\n/);

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.startsWith("#EXT-X-STREAM-INF:")) {
                        const resMatch = line.match(/RESOLUTION=(\d+x\d+)/i);
                        const bwMatch = line.match(/BANDWIDTH=(\d+)/i);
                        const resolution = resMatch ? resMatch[1] : "HD";
                        const bandwidth = bwMatch ? bwMatch[1] : "0";

                        let qLabel = "HD";
                        if (resolution.includes("1920") || resolution.includes("1080")) qLabel = "1080p";
                        else if (resolution.includes("1280") || resolution.includes("720")) qLabel = "720p";
                        else if (resolution.includes("854") || resolution.includes("480")) qLabel = "480p";
                        else if (resolution.includes("640") || resolution.includes("360")) qLabel = "360p";

                        if (i + 1 < lines.length) {
                            const streamPath = lines[i + 1].trim();
                            if (streamPath && !streamPath.startsWith("#")) {
                                const absStream = streamPath.startsWith("http") ? streamPath : base + streamPath;
                                variants.push({
                                    quality: qLabel,
                                    resolution: resolution,
                                    bandwidth: bandwidth,
                                    url: absStream
                                });
                            }
                        }
                    }
                }
                return variants;
            } catch (e) {
                return [];
            }
        }

        async function extractOtakuVidStreams(embedUrl) {
            try {
                const html = await fetchHtmlWithProxy(embedUrl);
                const decodedJs = unpackPackedJS(html);

                let masterUrl = null;
                const m3u8Match = (decodedJs + html).match(/https?:\/\/[^\s"'<>]+?\.(?:m3u8|txt)[^\s"'<>]*/i);
                if (m3u8Match) {
                    masterUrl = m3u8Match[0];
                }

                const variants = masterUrl ? await parseMasterPlaylist(masterUrl, embedUrl) : [];
                return { masterUrl, variants, rawHtml: html };
            } catch (e) {
                return { masterUrl: null, variants: [], error: e.message };
            }
        }

        async function getOtakuVidStreams(malId, epNum) {
            const cacheKey = `${malId}_${epNum}`;
            if (streamCache.has(cacheKey)) {
                return await streamCache.get(cacheKey);
            }

            const fetchPromise = (async () => {
                const matchedEntry = await searchOtakuVid(malId, epNum);
                if (!matchedEntry) throw new Error(`MAL ID ${malId} Episode ${epNum} not found in OtakuVid datasets`);

                const title = matchedEntry.anime_name || matchedEntry.title || `Anime ${malId}`;
                const streams = [];

                const embedEntries = [];
                Object.keys(matchedEntry).forEach(k => {
                    const v = matchedEntry[k];
                    if (typeof v === 'string') {
                        const kLower = k.lower ? k.lower() : String(k).toLowerCase();
                        const vLower = v.toLowerCase();
                        if (vLower.includes("otakuvid.online") || vLower.includes("earnvids") || vLower.includes("oktavid") || kLower.includes("otakuvid") || kLower.includes("oktavid") || kLower.includes("earnvids")) {
                            const isDub = kLower.includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    }
                });

                if (embedEntries.length === 0) {
                    // Fallback to any URL properties in matched entry
                    Object.keys(matchedEntry).forEach(k => {
                        const v = matchedEntry[k];
                        if (typeof v === 'string' && v.startsWith("http")) {
                            const isDub = k.toLowerCase().includes("dub");
                            embedEntries.push({ key: k, url: v, lang: isDub ? "dub" : "sub" });
                        }
                    });
                }

                for (const emb of embedEntries) {
                    try {
                        const extracted = await extractOtakuVidStreams(emb.url);
                        if (extracted.variants && extracted.variants.length > 0) {
                            extracted.variants.forEach(varItem => {
                                streams.push({
                                    server: `OtakuVid ${emb.lang.toUpperCase()} (${varItem.quality})`,
                                    url: varItem.url,
                                    type: "mp4",
                                    quality: varItem.quality,
                                    lang: emb.lang,
                                    embed_url: emb.url
                                });
                            });
                        } else if (extracted.masterUrl) {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (HD)`,
                                url: extracted.masterUrl,
                                type: "mp4",
                                quality: "HD",
                                lang: emb.lang,
                                embed_url: emb.url
                            });
                        } else {
                            streams.push({
                                server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                                url: emb.url,
                                type: "iframe",
                                quality: "Embed",
                                lang: emb.lang
                            });
                        }
                    } catch (e) {
                        streams.push({
                            server: `OtakuVid ${emb.lang.toUpperCase()} (Embed)`,
                            url: emb.url,
                            type: "iframe",
                            quality: "Embed",
                            lang: emb.lang
                        });
                    }
                }

                return {
                    status: "success",
                    server: "OtakuVid",
                    malId: parseInt(malId),
                    episode: parseInt(epNum),
                    animeTitle: title,
                    results: {
                        stream_url: streams.length > 0 ? streams[0].url : null,
                        streams: streams
                    }
                };
            })();

            streamCache.set(cacheKey, fetchPromise);
            return await fetchPromise;
        }

        async function preExtractNextEpisodes(malId, currentEpNum, totalToFetch = 50) {
            const myPrefetchToken = ++preFetchAbortToken;
            const startEp = parseInt(currentEpNum, 10) + 1;
            const statusEl = document.getElementById('prefetch-status');
            const statusIcon = document.getElementById('prefetch-icon');
            const statusText = document.getElementById('prefetch-status-text');

            const endEp = startEp + totalToFetch - 1;
            const targetCount = totalToFetch;

            if (statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#a78bfa';
                statusEl.style.background = 'rgba(167, 139, 250, 0.12)';
                statusEl.style.borderColor = 'rgba(167, 139, 250, 0.25)';
                if (statusIcon) statusIcon.textContent = '⚡';
                statusText.textContent = `Pre-extracting +${targetCount} Ep...`;
            }

            let fetchedCount = 0;
            for (let ep = startEp; ep <= endEp; ep++) {
                if (myPrefetchToken !== preFetchAbortToken) return;

                const cacheKey = `${malId}_${ep}`;
                if (!streamCache.has(cacheKey)) {
                    try {
                        await getOtakuVidStreams(malId, ep);
                        if (myPrefetchToken !== preFetchAbortToken) return;
                    } catch (e) {
                        // Silently handle background prefetch errors
                    }
                    await new Promise(r => setTimeout(r, 350));
                }
                fetchedCount++;
                if (statusText && myPrefetchToken === preFetchAbortToken) {
                    statusText.textContent = `Pre-extracting (${fetchedCount}/${targetCount})...`;
                }
            }

            if (myPrefetchToken === preFetchAbortToken && statusEl && statusText) {
                statusEl.style.display = 'flex';
                statusEl.style.color = '#4ade80';
                statusEl.style.background = 'rgba(74, 222, 128, 0.12)';
                statusEl.style.borderColor = 'rgba(74, 222, 128, 0.25)';
                if (statusIcon) statusIcon.textContent = '✓';
                statusText.textContent = `+${targetCount} Ep Ready`;
            }
        }

        function toggleBar() {
            const inner = document.getElementById('topbar-inner');
            const btn = document.getElementById('toggle-bar-btn');
            btn.classList.toggle('open', inner.classList.toggle('open'));
        }

        function toggleServerPanel() {
            const panel = document.getElementById('server-panel');
            const btn = document.getElementById('srv-toggle-btn');
            btn.classList.toggle('open', panel.classList.toggle('visible'));
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');

            const malId = String(document.getElementById('inp-mal').value).trim();
            const ep = String(document.getElementById('inp-ep').value).trim();

            if (allExtractedStreams && allExtractedStreams.length > 0 && cachedMalId === malId && cachedEp === ep) {
                const best = getBestHdStream(allExtractedStreams, lang);
                if (best) {
                    playStream(best);
                    renderServerPanel(allExtractedStreams);
                } else {
                    showPlayer(malId, ep, lang);
                }
            } else if (malId && ep) {
                showPlayer(malId, ep, lang);
            }
        }

        function playStream(stream) {
            activeServerStream = stream;
            const placeholder = document.getElementById('placeholder');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('player-iframe');

            placeholder.style.display = 'none';

            if (!stream) return;

            if (stream.type === 'iframe') {
                video.style.display = 'none';
                video.pause();
                iframe.src = stream.url;
                iframe.style.display = 'block';
                return;
            }

            iframe.style.display = 'none';
            iframe.src = 'about:blank';
            video.style.display = 'block';

            const proxiedUrl = getProxyUrl(stream.url);

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            if (proxiedUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(proxiedUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => { video.muted = true; video.play(); });
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = proxiedUrl;
                    video.play().catch(() => { video.muted = true; video.play(); });
                }
            } else {
                video.src = proxiedUrl;
                video.play().catch(() => { video.muted = true; video.play(); });
            }

            video.onended = () => {
                const malId = document.getElementById('inp-mal').value.trim();
                const ep = document.getElementById('inp-ep').value.trim();
                if (malId && ep) triggerAutoNext(malId, ep, currentLang);
            };
        }

        function renderServerPanel(streams) {
            const qRow = document.getElementById('quality-row');
            const srvList = document.getElementById('server-list');
            const spLoad = document.getElementById('sp-loading');
            const spErr = document.getElementById('sp-error');
            const srvBtn = document.getElementById('srv-toggle-btn');

            spLoad.style.display = 'none';
            spErr.style.display = 'none';
            qRow.innerHTML = '';
            srvList.innerHTML = '';

            if (!streams || !streams.length) {
                spErr.style.display = 'block';
                spErr.textContent = 'No streams found for this episode.';
                if (srvBtn) {
                    srvBtn.innerHTML = `
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="4" rx="1" />
                            <rect x="2" y="10" width="20" height="4" rx="1" />
                            <rect x="2" y="17" width="20" height="4" rx="1" />
                        </svg>
                        Servers
                    `;
                }
                return;
            }

            const qualSet = new Set(["1080p", "720p", "480p", "360p"]);
            streams.forEach(s => { if (s.quality && s.quality !== 'Embed') qualSet.add(s.quality); });

            Array.from(qualSet).forEach(q => {
                let matchingStream = streams.find(s => s.lang === currentLang && ((s.quality || '').includes(q) || (s.server || '').includes(q)));
                if (!matchingStream) {
                    matchingStream = streams.find(s => (s.quality || '').includes(q) || (s.server || '').includes(q));
                }

                const pill = document.createElement('button');
                const isActive = (matchingStream && activeServerStream === matchingStream);
                pill.className = 'q-pill' + (isActive ? ' active' : '') + (matchingStream ? '' : ' unavail');
                pill.textContent = q;
                if (matchingStream) {
                    pill.onclick = () => {
                        document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                        playStream(matchingStream);
                        if (matchingStream.lang) {
                            currentLang = matchingStream.lang;
                            document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                            document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                        }
                        renderServerPanel(allExtractedStreams);
                    };
                }
                qRow.appendChild(pill);
            });

            const sortedStreams = [...streams].sort((a, b) => {
                if (a.lang === currentLang && b.lang !== currentLang) return -1;
                if (a.lang !== currentLang && b.lang === currentLang) return 1;
                return 0;
            });

            sortedStreams.forEach((st, idx) => {
                const btn = document.createElement('button');
                const isCurrentActive = (activeServerStream === st || (!activeServerStream && idx === 0));
                btn.className = 'srv-btn' + (isCurrentActive ? ' active' : '');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = st.server || `OtakuVid Server ${idx + 1}`;
                btn.appendChild(nameSpan);

                const badgeText = (st.quality || '') + (st.lang ? ` ${st.lang.toUpperCase()}` : '');
                if (badgeText.trim()) {
                    const badge = document.createElement('span');
                    badge.className = 'srv-badge';
                    badge.textContent = badgeText.trim();
                    btn.appendChild(badge);
                }

                btn.onclick = () => {
                    document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playStream(st);
                    if (st.lang) {
                        currentLang = st.lang;
                        document.getElementById('btn-dub').classList.toggle('active', currentLang === 'dub');
                        document.getElementById('btn-sub').classList.toggle('active', currentLang === 'sub');
                    }
                    renderServerPanel(allExtractedStreams);
                };

                srvList.appendChild(btn);
            });

            if (srvBtn) {
                const activeRes = activeServerStream ? `${activeServerStream.quality} ${activeServerStream.lang ? activeServerStream.lang.toUpperCase() : ''}` : '';
                srvBtn.innerHTML = `
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="4" rx="1" />
                        <rect x="2" y="10" width="20" height="4" rx="1" />
                        <rect x="2" y="17" width="20" height="4" rx="1" />
                    </svg>
                    Servers (${activeRes.trim() ? activeRes.trim() : streams.length + ' Streams'})
                `;
            }
        }

        function getBestHdStream(streams, preferredLang = 'dub') {
            if (!streams || streams.length === 0) return null;
            const priority = ["1080p", "720p", "480p", "360p"];

            const prefStreams = streams.filter(s => s.lang === preferredLang);
            if (prefStreams.length > 0) {
                for (const res of priority) {
                    const found = prefStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return prefStreams[0];
            }

            const altLang = preferredLang === 'dub' ? 'sub' : 'dub';
            const altStreams = streams.filter(s => s.lang === altLang);
            if (altStreams.length > 0) {
                for (const res of priority) {
                    const found = altStreams.find(s => (s.quality || s.server || '').includes(res));
                    if (found) return found;
                }
                return altStreams[0];
            }

            for (const res of priority) {
                const found = streams.find(s => (s.quality || s.server || '').includes(res));
                if (found) return found;
            }
            return streams[0];
        }

        async function showPlayer(malId, ep, lang = 'dub') {
            cancelAutoNext();
            currentLang = lang;
            const myToken = ++_fetchToken;

            document.getElementById('inp-mal').value = malId;
            document.getElementById('inp-ep').value = ep;
            document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
            document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');

            document.title = `OtakuVid · MAL ${malId} · Ep ${ep} · ${lang.toUpperCase()}`;

            const spinner = document.getElementById('extract-spinner');
            const prefetchStatus = document.getElementById('prefetch-status');
            if (spinner) spinner.style.display = 'flex';
            if (prefetchStatus) prefetchStatus.style.display = 'none';

            document.getElementById('srv-toggle-btn').classList.add('show');
            document.getElementById('quality-row').innerHTML = '';
            document.getElementById('server-list').innerHTML = '';
            document.getElementById('sp-error').style.display = 'none';
            document.getElementById('sp-loading').style.display = 'flex';

            try {
                const data = await getOtakuVidStreams(malId, ep);
                if (myToken !== _fetchToken) return;

                document.getElementById('sp-loading').style.display = 'none';

                const streams = data.results.streams || [];
                allExtractedStreams = streams;
                cachedMalId = String(malId);
                cachedEp = String(ep);

                if (streams.length > 0) {
                    const best = getBestHdStream(streams, lang);
                    playStream(best);
                    renderServerPanel(streams);

                    preExtractNextEpisodes(malId, ep, 50);
                } else {
                    document.getElementById('sp-error').style.display = 'block';
                    document.getElementById('sp-error').textContent = `No streams available for MAL ${malId} Ep ${ep}.`;
                }
            } catch (err) {
                if (myToken !== _fetchToken) return;
                document.getElementById('sp-loading').style.display = 'none';
                document.getElementById('sp-error').style.display = 'block';
                document.getElementById('sp-error').textContent = 'Error: ' + err.message;
            } finally {
                if (myToken === _fetchToken && spinner) {
                    spinner.style.display = 'none';
                }
            }
        }

        function loadPlayer() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = document.getElementById('inp-ep').value.trim();
            if (!malId || !ep) { alert('Please enter both MAL ID and episode number.'); return; }
            showPlayer(malId, ep, currentLang);
        }

        function goPrevEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep) || ep <= 1) return;
            showPlayer(malId, ep - 1, currentLang);
        }

        function goNextEp() {
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function triggerAutoNext(malId, ep, lang) {
            if (!document.getElementById('chk-autonext').checked) return;
            const nextEp = parseInt(ep, 10) + 1;
            document.getElementById('an-ep-label').textContent = `Episode ${nextEp}`;
            const overlay = document.getElementById('autonext-overlay');
            const bar = document.getElementById('an-bar');
            overlay.style.display = 'block';
            bar.style.transition = 'none';
            bar.style.transform = 'scaleX(1)';
            bar.getBoundingClientRect();
            bar.style.transition = `transform ${COUNTDOWN_S}s linear`;
            bar.style.transform = 'scaleX(0)';
            let remaining = COUNTDOWN_S;
            autoNextTimer = setInterval(() => { if (--remaining <= 0) goNextNow(); }, 1000);
        }

        function goNextNow() {
            cancelAutoNext();
            const malId = document.getElementById('inp-mal').value.trim();
            const ep = parseInt(document.getElementById('inp-ep').value.trim(), 10);
            if (!malId || isNaN(ep)) return;
            showPlayer(malId, ep + 1, currentLang);
        }

        function cancelAutoNext() {
            clearInterval(autoNextTimer);
            autoNextTimer = null;
            const overlay = document.getElementById('autonext-overlay');
            if (overlay) overlay.style.display = 'none';
        }

        function parseParamsFromUrl() {
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            const pathMatch = path.match(/\/(\d+)\/(\d+)(?:\/(dub|sub))?\/?$/i);
            if (pathMatch) {
                return { malId: pathMatch[1], epNum: pathMatch[2], lang: pathMatch[3] || 'dub' };
            }

            const queryDirectMatch = search.match(/\?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (queryDirectMatch) {
                return { malId: queryDirectMatch[1], epNum: queryDirectMatch[2], lang: queryDirectMatch[3] || 'dub' };
            }

            const searchParams = new URLSearchParams(search);
            const qMal = searchParams.get('mal_id') || searchParams.get('malId') || searchParams.get('id');
            const qEp = searchParams.get('ep') || searchParams.get('ep_num') || searchParams.get('episode');
            const qLang = searchParams.get('lang') || searchParams.get('type');
            if (qMal && qEp) {
                return { malId: qMal, epNum: qEp, lang: qLang || 'dub' };
            }

            const hashMatch = hash.match(/#\/?(\d+)[\/&](\d+)(?:[\/&](dub|sub))?/i);
            if (hashMatch) {
                return { malId: hashMatch[1], epNum: hashMatch[2], lang: hashMatch[3] || 'dub' };
            }

            return null;
        }

        window.OtakuVidAPI = {
            getStreams: getOtakuVidStreams,
            search: searchOtakuVid,
            loadDatasets: loadAllDatasets,
            getProxyUrl: getProxyUrl
        };

        window.addEventListener('DOMContentLoaded', () => {
            const params = parseParamsFromUrl();
            if (params) {
                showPlayer(params.malId, params.epNum, params.lang);
            }
        });
    </script>
